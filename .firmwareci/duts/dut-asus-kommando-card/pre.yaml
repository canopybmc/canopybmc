pre-stage:
  - cmd: dutctl
    name: Power off DUT
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: power-off

  - cmd: dutctl
    name: Power cycle USB
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: power-cycle-usb

  - cmd: dutctl
    name: Flash Image
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: flash
      args: ["write", "[[input.firmware]]"]
    options:
      timeout: 10m0s

  - cmd: dutctl
    name: Power on DUT
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: power-on

  - cmd: dutctl
    name: Wait for boot banner on serial
    options:
      timeout: 10m
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: serial
      args: ["expect", "Phosphor OpenBMC"]

  - cmd: ping
    name: Wait for SSH
    options:
      timeout: 5m
    parameters:
      host: "[[attributes.BMC]]"

  - cmd: cmd
    name: Wait for BMC services
    transport: &local
      proto: local
    options:
      timeout: 2m
    parameters:
      executable: sleep
      args: ["15"]
