post-stage:
  # Allowed to fail
  - cmd: shell
    name: Power off host via Redfish
    transport:
      proto: local
    parameters:
      command: >-
        curl -sk -u root:[[attributes.BMCPassword]]
        -X POST -H 'Content-Type: application/json'
        -d '{"ResetType":"ForceOff"}'
        -o /dev/null -w '%{http_code}'
        https://[[attributes.BMC]]/redfish/v1/Systems/system/Actions/ComputerSystem.Reset || true

  - cmd: shell
    name: Host system DC gets/stays powered off (systemd-journal)
    options:
      timeout: 1m
      on-error: continue
    transport: &bmc_ssh
      proto: ssh
      options:
        host: "[[attributes.BMC]]"
        user: "root"
        password: "[[attributes.BMCPassword]]"
    parameters:
      command: |
        journalctl -t power-control -f \
          | awk '{print} /Host system DC power is off|No action taken/{exit}'

  - cmd: redfish
    name: Current host PowerState is off
    options:
      timeout: 10s
      on-error: continue
    transport:
      proto: local
    parameters:
      host: "[[attributes.BMC]]"
      auth:
        user: root
        password: "[[attributes.BMCPassword]]"
      validate: inventory
      inventory:
        rules:
          - path: /redfish/v1/Systems/system
            prop: PowerState
            op: eq
            value: "Off"

  - cmd: copy
    name: Copy original NVRAM to DUT
    options:
      on-error: continue
    transport: *bmc_ssh
    parameters:
      source: "[[storage.dl320g11_nvram]]"
      destination: /tmp
      recursive: true

  - cmd: shell
    name: Flash original NVRAM to DUT
    options:
      on-error: continue
    transport: *bmc_ssh
    parameters:
      command: "flashcp -v /tmp/[[storage.dl320g11_nvram.rom]] /dev/mtd/host-reserved"

  - cmd: dutctl
    name: Power off DUT
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: power
      args: ["off"]

  - cmd: dutctl
    name: Reload golden image to host
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: emulate-host
      args: ["[[storage.dl320g11_bios_update]]/[[storage.dl320g11_bios_update.golden_image]]"]
