pre-stage:
  - cmd: dutctl
    name: Power off DUT
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: power
      args: ["off"]

  - cmd: dutctl
    name: Emulate Flash
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: emulate-bmc
      args: ["[[input.firmware]]"]

  - cmd: dutctl
    name: Emulate BIOS Flash with golden image
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: emulate-host
      args: ["[[storage.dl320g11_bios_update]]/[[storage.dl320g11_bios_update.golden_image]]"]

  - cmd: dutctl
    name: Power on DUT
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: power
      args: ["on"]

  - cmd: cmd
    name: Setup Tools
    transport: &local
      proto: local
    options:
      timeout: 2m
    parameters:
      executable: cat
      args: ["[[storage.dl320_tools]]/dummy.txt"]

  - cmd: dutctl
    name: Wait for boot banner on serial
    options:
      timeout: 10m
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: serial
      args: ["expect", "Phosphor OpenBMC"]

  - cmd: ping
    name: Wait for SSH
    options:
      timeout: 5m
    parameters:
      host: "[[attributes.BMC]]"

  - cmd: shell
    name: Wait for BMC ready
    transport: &bmc_ssh
      proto: ssh
      options:
        host: "[[attributes.BMC]]"
        port: "[[attributes.SSHPort]]"
        user: "[[attributes.BMCUser]]"
        password: "[[attributes.BMCPassword]]"
    options:
      timeout: 2m
    parameters:
      command: "journalctl -t phosphor-bmc-state-manager -f | grep -m 1 BMC_READY"

  - cmd: redfish
    name: Power off host to reset NVRAM/EVs to known good state
    transport: *local
    parameters:
      host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
      auth:
        user: "[[attributes.BMCUser]]"
        password: "[[attributes.BMCPassword]]"
      validate: request
      request:
        method: POST
        path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
        body: {ResetType: ForceOff}
        # 409: the host is off already.
        status: [200, 202, 204, 409]

  - cmd: shell
    name: Host system DC gets/stays powered off (systemd-journal)
    options:
      timeout: 20s
    transport: *bmc_ssh
    parameters:
      command: |
        journalctl -t power-control -f \
          | awk '{print} /Host system DC power is off|No action taken/{exit}'

  - cmd: redfish
    name: Current host PowerState is off
    options:
      timeout: 10s
    transport: *local
    parameters:
      host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
      auth:
        user: "[[attributes.BMCUser]]"
        password: "[[attributes.BMCPassword]]"
      validate: inventory
      inventory:
        rules:
          - path: "[[attributes.RedfishSystem]]"
            prop: PowerState
            op: eq
            value: "Off"

  - cmd: copy
    name: Copy original NVRAM + EVs to DUT
    transport: *bmc_ssh
    parameters:
      source: "[[storage.dl320g11_nvram]]"
      destination: /tmp
      recursive: true

  - cmd: shell
    name: Flash original NVRAM to DUT
    options:
      on-failure: continue
    transport: *bmc_ssh
    parameters:
      command: "flashcp -v /tmp/[[storage.dl320g11_nvram.rom]] /dev/mtd/host-reserved"

  - cmd: shell
    name: Copy EVs to CHIF path
    transport: *bmc_ssh
    parameters:
      command: "cp /tmp/[[storage.dl320g11_nvram.evs]] /var/lib/chif/evs.dat"

  - cmd: shell
    name: Restart CHIF service
    transport: *bmc_ssh
    parameters:
      command: "systemctl restart xyz.openbmc_project.GxpChif.service"
