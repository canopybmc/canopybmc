pre-stage:
  - cmd: dutctl
    name: Power off DUT
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: power
      args: ["off"]

  - cmd: dutctl
    name: Emulate Flash
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: emulate-bmc
      args: ["[[input.firmware]]"]

  - cmd: dutctl
    name: Emulate BIOS Flash with golden image
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: emulate-host
      args: ["[[storage.dl320g11_bios_update]]/[[storage.dl320g11_bios_update.golden_image]]"]

  - cmd: dutctl
    name: Power on DUT
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: power
      args: ["on"]

  - cmd: cmd
    name: Setup Tools
    transport: &local
      proto: local
    options:
      timeout: 2m
    parameters:
      executable: cat
      args: ["[[storage.dl320_tools]]/dummy.txt"]

  - cmd: dutctl
    name: Wait for boot banner on serial
    options:
      timeout: 10m
    parameters:
      agent: "[[attributes.Agent]]"
      device: "[[attributes.Device]]"
      command: serial
      args: ["expect", "Phosphor OpenBMC"]

  - cmd: ping
    name: Wait for SSH
    options:
      timeout: 5m
    parameters:
      host: "[[attributes.BMC]]"

  - cmd: shell
    name: Wait for BMC ready
    transport: &bmc_ssh
      proto: ssh
      options:
        host: "[[attributes.BMC]]"
        user: root
        password: "[[attributes.BMCPassword]]"
    options:
      timeout: 2m
    parameters:
      command: "journalctl -t phosphor-bmc-state-manager -f | grep -m 1 BMC_READY"
