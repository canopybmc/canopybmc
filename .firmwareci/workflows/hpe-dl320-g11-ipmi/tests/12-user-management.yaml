name: "IPMI: User Management Lifecycle (NetFn 0x06)"
description: >-
  Create an IPMI user in slot 2 (NetFn 0x06), confirm it works over IPMI LAN
  and is visible and manageable in Redfish and on D-Bus as an Administrator,
  then delete it and confirm it is gone from IPMI and Redfish. Also
  regression-tests a non-contiguous slot (user in slot 3 while slot 2 is
  empty), which previously left the user unusable and unmanageable in Redfish.
  The test first removes users left in slots 2 and 3 by an earlier run, and
  removes them again in the last stages, also after a failure.

defaults:
  local: &local
    proto: local
  lan: &lan
    host: "[[attributes.BMC]]"
    user: "[[attributes.BMCUser]]"
    password: "[[attributes.BMCPassword]]"
    cipher: 17
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  # An empty user name deletes the user; on an empty slot it changes nothing.
  cleanup: &cleanup
    - cmd: ipmi
      name: User slot 3 is emptied
      transport: *local
      parameters:
        lan: *lan
        set: user/3/name
        value: ""
        expect: {completion: 0x00}
    - cmd: ipmi
      name: User slot 2 is emptied
      transport: *local
      parameters:
        lan: *lan
        set: user/2/name
        value: ""
        expect: {completion: 0x00}

stages:
  - name: Remove Leftover Users
    steps: *cleanup

  - name: Create User
    steps:
      - cmd: ipmi
        name: Set User Name, slot 2 fwcitest
        transport: *local
        parameters:
          lan: *lan
          set: user/2/name
          value: fwcitest
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Set User Password, slot 2
        transport: *local
        parameters:
          lan: *lan
          set: user/2/password
          value: Testpass123
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Set User Access, slot 2, channel 1, Administrator
        transport: *local
        parameters:
          lan: *lan
          set: user/2/privilege
          value: administrator
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Enable User, slot 2
        transport: *local
        parameters:
          lan: *lan
          set: user/2/enabled
          value: true
          expect: {completion: 0x00}

  - name: Verify User Exists
    on-failure: continue
    steps:
      - cmd: ipmi
        name: Get User Name, slot 2 is fwcitest
        transport: *local
        parameters:
          lan: *lan
          get: user/2/name
          expect: {eq: fwcitest}
      - cmd: ipmi
        name: Get User Access, slot 2 is Administrator on channel 1
        transport: *local
        parameters:
          lan: *lan
          get: user/2/privilege
          expect: {eq: administrator}
      - cmd: shell
        name: fwcitest on D-Bus has priv-admin
        transport: *bmc
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.User.Manager
            /xyz/openbmc_project/user/fwcitest
            xyz.openbmc_project.User.Attributes UserPrivilege
          expect:
            - regex: '^s "priv-admin"\s*$'
      - cmd: shell
        name: fwcitest on D-Bus is enabled
        transport: *bmc
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.User.Manager
            /xyz/openbmc_project/user/fwcitest
            xyz.openbmc_project.User.Attributes UserEnabled
          expect:
            - regex: '^b true\s*$'
      - cmd: shell
        name: fwcitest on D-Bus is in the ipmi group
        transport: *bmc
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.User.Manager
            /xyz/openbmc_project/user/fwcitest
            xyz.openbmc_project.User.Attributes UserGroups
          expect:
            - regex: '"ipmi"'
      - cmd: redfish
        name: Account fwcitest is visible in Redfish
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 1m}
            rules:
              - {path: /redfish/v1/AccountService/Accounts/fwcitest, prop: UserName, op: eq, value: fwcitest}
      - cmd: redfish
        name: Account fwcitest has the Administrator role
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Accounts/fwcitest, prop: RoleId, op: eq, value: Administrator}
      - cmd: redfish
        name: Account fwcitest is enabled in Redfish
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Accounts/fwcitest, prop: Enabled, op: eq, value: "true"}
      - cmd: redfish
        name: Account fwcitest is manageable via Redfish PATCH
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: PATCH
            path: /redfish/v1/AccountService/Accounts/fwcitest
            body: {Enabled: true}
            status: [200, 204]

  - name: Verify User Login
    steps:
      - cmd: ipmi
        name: fwcitest opens an Administrator session over LAN
        transport: *local
        parameters:
          lan: {host: "[[attributes.BMC]]", user: fwcitest, password: Testpass123, cipher: 17}
          get: device/device-id
          expect: exists

  - name: Delete User
    steps:
      - cmd: ipmi
        name: Disable User, slot 2
        transport: *local
        parameters:
          lan: *lan
          set: user/2/enabled
          value: false
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Downgrade User Access, slot 2, channel 1, User
        transport: *local
        parameters:
          lan: *lan
          set: user/2/privilege
          value: user
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Clear User Name, slot 2
        transport: *local
        parameters:
          lan: *lan
          set: user/2/name
          value: ""
          expect: {completion: 0x00}

  - name: Verify Deletion
    on-failure: continue
    steps:
      - cmd: ipmi
        name: Get User Name, slot 2 is empty
        transport: *local
        parameters:
          lan: *lan
          get: user/2/name
          expect: {matches: '^$'}
      - cmd: ipmi
        name: Get User Access, slot 2 has no access on channel 1
        transport: *local
        parameters:
          lan: *lan
          get: user/2/privilege
          expect: {eq: no-access}
      - cmd: redfish
        name: Account fwcitest is removed from Redfish (HTTP 404)
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request: {method: GET, path: /redfish/v1/AccountService/Accounts/fwcitest, status: 404}

  - name: Non-Contiguous Slot - Create in Slot 3 (slot 2 empty)
    steps:
      - cmd: ipmi
        name: Set User Name, slot 3 fwcigap
        transport: *local
        parameters:
          lan: *lan
          set: user/3/name
          value: fwcigap
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Set User Password, slot 3
        transport: *local
        parameters:
          lan: *lan
          set: user/3/password
          value: "GapUser789!"
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Set User Access, slot 3, channel 1, Administrator
        transport: *local
        parameters:
          lan: *lan
          set: user/3/privilege
          value: administrator
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Enable User, slot 3
        transport: *local
        parameters:
          lan: *lan
          set: user/3/enabled
          value: true
          expect: {completion: 0x00}

  - name: Non-Contiguous Slot - Verify on BMC (IPMI)
    on-failure: continue
    steps:
      - cmd: ipmi
        name: Get User Name, slot 3 is fwcigap
        transport: *local
        parameters:
          lan: *lan
          get: user/3/name
          expect: {eq: fwcigap}
      - cmd: ipmi
        name: Slot 2 is still empty
        transport: *local
        parameters:
          lan: *lan
          get: user/2/name
          expect: {matches: '^$'}
      # The ipmi step reads one slot per step, so ipmitool lists all slots.
      - cmd: shell
        name: fwcigap occupies exactly one user slot
        transport: *local
        parameters:
          command: >-
            ipmitool -I lanplus -H [[attributes.BMC]] -U [[attributes.BMCUser]]
            -P [[attributes.BMCPassword]] -C 17 user list 1
            | awk '$2 == "fwcigap"' | wc -l
          expect:
            - regex: '^\s*1\s*$'
      - cmd: ipmi
        name: Slot 3 reaches Administrator on channel 1
        transport: *local
        parameters:
          lan: *lan
          get: user/3/privilege
          retry: {timeout: 30s}
          expect: {eq: administrator}
      - cmd: shell
        name: fwcigap on D-Bus has priv-admin
        transport: *bmc
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.User.Manager
            /xyz/openbmc_project/user/fwcigap
            xyz.openbmc_project.User.Attributes UserPrivilege
          expect:
            - regex: '^s "priv-admin"\s*$'
      - cmd: shell
        name: fwcigap on D-Bus is enabled
        transport: *bmc
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.User.Manager
            /xyz/openbmc_project/user/fwcigap
            xyz.openbmc_project.User.Attributes UserEnabled
          expect:
            - regex: '^b true\s*$'
      - cmd: shell
        name: fwcigap on D-Bus is in the ipmi group
        transport: *bmc
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.User.Manager
            /xyz/openbmc_project/user/fwcigap
            xyz.openbmc_project.User.Attributes UserGroups
          expect:
            - regex: '"ipmi"'
      - cmd: ipmi
        name: fwcigap opens an Administrator session over LAN
        transport: *local
        parameters:
          lan: {host: "[[attributes.BMC]]", user: fwcigap, password: "GapUser789!", cipher: 17}
          get: device/device-id
          expect: exists

  - name: Non-Contiguous Slot - Verify in Redfish
    on-failure: continue
    steps:
      - cmd: redfish
        name: Account fwcigap is visible in Redfish
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 1m}
            rules:
              - {path: /redfish/v1/AccountService/Accounts/fwcigap, prop: UserName, op: eq, value: fwcigap}
      - cmd: redfish
        name: Account fwcigap has the Administrator role
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Accounts/fwcigap, prop: RoleId, op: eq, value: Administrator}
      - cmd: redfish
        name: Account fwcigap is enabled in Redfish
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Accounts/fwcigap, prop: Enabled, op: eq, value: "true"}
      - cmd: redfish
        name: Account fwcigap is manageable via Redfish PATCH
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: PATCH
            path: /redfish/v1/AccountService/Accounts/fwcigap
            body: {Enabled: true}
            status: [200, 204]

  - name: Remove Test Users
    on-failure: continue
    steps: *cleanup

  - name: Remove Test Users after a failure
    run-condition: failure
    on-failure: continue
    steps: *cleanup
