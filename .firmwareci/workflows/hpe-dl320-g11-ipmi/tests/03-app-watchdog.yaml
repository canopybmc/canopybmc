name: "IPMI: App - BMC Watchdog Timer Commands (NetFn 0x06)"
description: >-
  Validate BMC Watchdog Timer commands (Table G-1, §27): Get Watchdog Timer
  (25h), Set Watchdog Timer (24h) and Reset Watchdog Timer (22h). The test
  checks the 300-second default, sets a 120-second countdown with no timeout
  action, resets it and verifies the value over IPMI and on phosphor-watchdog.
  The last stages turn the timer off with the 300-second default again, also
  after a failure.

defaults:
  local: &local
    proto: local
  lan: &lan
    host: "[[attributes.BMC]]"
    user: "[[attributes.BMCUser]]"
    password: "[[attributes.BMCPassword]]"
    cipher: 17
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  restore: &restore
    - cmd: ipmi
      name: Watchdog off with the 300-second default is accepted
      transport: *local
      parameters:
        lan: *lan
        set: watchdog
        value: "off"
        expect: {completion: 0x00}
    - cmd: ipmi
      name: Initial countdown is back at 300 seconds
      transport: *local
      parameters:
        lan: *lan
        get: watchdog/initial-countdown
        expect: {eq: 300s}

stages:
  - name: Check for default Watchdog Timer value
    steps:
      - cmd: ipmi
        name: Initial countdown is the 300-second default
        transport: *local
        parameters:
          lan: *lan
          get: watchdog/initial-countdown
          expect: {eq: 300s}

  - name: Set and Reset Watchdog Timer
    steps:
      - cmd: ipmi
        name: Set Watchdog Timer to 120 seconds, no action
        transport: *local
        parameters:
          lan: *lan
          set: watchdog
          value: {timer-use: sms-os, timeout-action: none, initial-countdown: 120s}
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Reset Watchdog Timer is accepted
        transport: *local
        parameters:
          lan: *lan
          set: watchdog
          value: reset
          expect: {completion: 0x00}

  - name: Verify Watchdog Timer Configuration
    steps:
      - cmd: ipmi
        name: Initial countdown reads back as 120 seconds
        transport: *local
        parameters:
          lan: *lan
          get: watchdog/initial-countdown
          expect: {eq: 120s}

  - name: Verify Watchdog reached phosphor-watchdog on BMC
    on-failure: continue
    steps:
      - cmd: shell
        name: phosphor-watchdog Interval is 120000 ms
        transport: *bmc
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.Watchdog
            /xyz/openbmc_project/watchdog/host0
            xyz.openbmc_project.State.Watchdog Interval
          expect:
            - regex: '^t 120000\s*$'
      - cmd: shell
        name: phosphor-watchdog is enabled
        transport: *bmc
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.Watchdog
            /xyz/openbmc_project/watchdog/host0
            xyz.openbmc_project.State.Watchdog Enabled
          expect:
            - regex: '^b true\s*$'
      - cmd: shell
        name: phosphor-watchdog expire action is None
        transport: *bmc
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.Watchdog
            /xyz/openbmc_project/watchdog/host0
            xyz.openbmc_project.State.Watchdog ExpireAction
          expect:
            - regex: 'Action\.None"'
      - cmd: shell
        name: phosphor-watchdog timer use is SMS/OS
        transport: *bmc
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.Watchdog
            /xyz/openbmc_project/watchdog/host0
            xyz.openbmc_project.State.Watchdog CurrentTimerUse
          expect:
            - regex: 'TimerUse\.SMSOS"'
      - cmd: shell
        name: phosphor-watchdog daemon is active
        transport: *bmc
        parameters:
          command: systemctl is-active phosphor-watchdog.service
          expect:
            - regex: '^active\s*$'
      - cmd: shell
        name: Expire action HardReset maps to the host reset service
        transport: *bmc
        parameters:
          command: systemctl cat phosphor-watchdog.service
          expect:
            - regex: 'Action\.HardReset=phosphor-watchdog-host-reset\.service'
      - cmd: shell
        name: Expire action PowerOff maps to the host power-off service
        transport: *bmc
        parameters:
          command: systemctl cat phosphor-watchdog.service
          expect:
            - regex: 'Action\.PowerOff=phosphor-watchdog-host-poweroff\.service'
      - cmd: shell
        name: Expire action PowerCycle maps to the power-cycle service
        transport: *bmc
        parameters:
          command: systemctl cat phosphor-watchdog.service
          expect:
            - regex: 'Action\.PowerCycle=phosphor-watchdog-host-powercycle\.service'

  - name: Restore Default Watchdog Timer
    steps: *restore

  - name: Restore Default Watchdog Timer after a failure
    run-condition: failure
    on-failure: continue
    steps: *restore
