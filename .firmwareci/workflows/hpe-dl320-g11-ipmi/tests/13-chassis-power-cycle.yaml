name: "IPMI: Chassis Power Cycle"
description: >-
  Validate a host power cycle with IPMI Chassis Control: power off, then
  power on. The test saves the power restore policy, ensures the host is on
  to begin with, sets the restore policy to always-on, powers the host off
  and waits until chassis power reads off, then powers it back on and waits
  until chassis power reads on. The last stages write the saved restore
  policy back, also after a failure.

variables:
  RESTORE_POLICY: unsaved

defaults:
  local: &local
    proto: local
  lan: &lan
    host: "[[attributes.BMC]]"
    user: "[[attributes.BMCUser]]"
    password: "[[attributes.BMCPassword]]"
    cipher: 17
  restore: &restore
    # The ipmi step takes no stored variable in set, so ipmitool writes the saved policy.
    - cmd: shell
      name: Power restore policy is written back
      transport: *local
      parameters:
        command: |
          policy={{ RESTORE_POLICY }}
          [ "$policy" = unsaved ] && { echo "policy not saved, nothing to restore"; exit 0; }
          ipmitool -I lanplus -H [[attributes.BMC]] -U [[attributes.BMCUser]] -P [[attributes.BMCPassword]] -C 17 \
            chassis policy "$policy"

stages:
  - name: Pre-condition Checks
    steps:
      - cmd: ipmi
        name: Power restore policy is a defined value
        transport: *local
        parameters:
          lan: *lan
          get: chassis/power-restore-policy
          expect: {matches: '^(always-off|previous|always-on)$'}
          variable: RESTORE_POLICY
      - cmd: ipmi
        name: Host power on is accepted
        transport: *local
        parameters:
          lan: *lan
          set: chassis/power
          value: "on"
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Chassis power reads on
        transport: *local
        parameters:
          lan: *lan
          get: chassis/power
          retry: {timeout: 8m, interval: 5s}
          expect: {eq: "on"}

  - name: Set Restore Policy
    steps:
      - cmd: ipmi
        name: Power restore policy always-on is accepted
        transport: *local
        parameters:
          lan: *lan
          set: chassis/power-restore-policy
          value: always-on
          expect: {completion: 0x00}

  - name: Power Down
    steps:
      - cmd: ipmi
        name: Chassis Control power down is accepted
        transport: *local
        parameters:
          lan: *lan
          set: chassis/power
          value: "off"
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Chassis power reads off after power down
        transport: *local
        parameters:
          lan: *lan
          get: chassis/power
          retry: {timeout: 1m, interval: 5s}
          expect: {eq: "off"}

  - name: Power On
    steps:
      # Lets the host power settle after power down; chassis power has no state for that.
      - cmd: sleep
        name: Settle before powering on
        parameters:
          duration: 20s
      - cmd: ipmi
        name: Chassis Control power on is accepted
        transport: *local
        parameters:
          lan: *lan
          set: chassis/power
          value: "on"
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Chassis power reads on after power on
        transport: *local
        parameters:
          lan: *lan
          get: chassis/power
          retry: {timeout: 8m, interval: 5s}
          expect: {eq: "on"}

  - name: Restore Power Restore Policy
    steps: *restore

  - name: Restore Power Restore Policy after a failure
    run-condition: failure
    steps: *restore
