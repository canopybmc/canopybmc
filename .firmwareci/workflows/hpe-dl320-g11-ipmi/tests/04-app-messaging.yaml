name: "IPMI: App - BMC Device and Messaging Commands (NetFn 0x06)"
description: >-
  Verify BMC Device and Messaging commands (Table G-1, §22): Get BMC Global
  Enables (2Fh), Get BT Interface Capabilities (36h), Get System Interface
  Capabilities (57h, not registered on this platform), Get System GUID (37h)
  once the BIOS has sent its SMBIOS tables, Get Channel Authentication
  Capabilities (38h), Get Session Info (3Dh), Get Channel Access (41h), Get
  Channel Info (42h) for the LAN channel 1 and the KCS channel 15, Get User
  Access (44h), Get User Name (46h), Get Channel Cipher Suites (54h) and Get
  System Info Parameters (59h).

defaults:
  local: &local
    proto: local
  lan: &lan
    host: "[[attributes.BMC]]"
    user: "[[attributes.BMCUser]]"
    password: "[[attributes.BMCPassword]]"
    cipher: 17
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: BMC Global Enables and Interface Capabilities
    on-failure: continue
    steps:
      - cmd: ipmi
        name: Global enables report System Event Logging enabled
        transport: *local
        parameters:
          lan: *lan
          raw: 0x06 0x2f
          expect: {byte: 0, mask: 0x08, eq: 0x08}
      - cmd: ipmi
        name: BT capabilities allow at least one outstanding request
        transport: *local
        parameters:
          lan: *lan
          raw: 0x06 0x36
          expect: {byte: 0, ge: 1}
      # 57h is only implemented by the 'arm' ipmid OEM provider, which reports
      # SSIF capabilities. This platform's host interface is KCS (ipmi_kcs1,
      # channel 15) and OBMC_ORG_IPMI_OEM_PROVIDERS is empty, so the handler is
      # never registered and ipmid rejects the command with 0xC1.
      - cmd: ipmi
        name: Get System Interface Capabilities is rejected with 0xC1
        transport: *local
        parameters:
          lan: *lan
          raw: 0x06 0x57 0x00
          expect: {completion: 0xc1}

  - name: Wait for SMBIOS System GUID source
    steps:
      - cmd: ipmi
        name: Host power on is accepted
        transport: *local
        parameters:
          lan: *lan
          set: chassis/power
          value: "on"
          expect: {completion: 0x00}
      # Restarts GxpChif when its push queue fills up, as the transfer then stalls.
      - cmd: shell
        name: smbios-mdr publishes a non-zero System UUID
        transport: *bmc
        options:
          timeout: 15m
        parameters:
          command: |
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full')
            until busctl get-property xyz.openbmc_project.Smbios.MDR_V2 \
                /xyz/openbmc_project/inventory/system/chassis/motherboard/bios \
                xyz.openbmc_project.Common.UUID UUID 2>/dev/null | grep -qiE '[1-9a-f]'; do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full')
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF"
                systemctl restart xyz.openbmc_project.GxpChif.service
                full=$now
              fi
              sleep 5
            done
            echo "System GUID source ready"
          expect:
            - regex: 'System GUID source ready'

  - name: System Identity and Authentication
    on-failure: continue
    steps:
      - cmd: ipmi
        name: System GUID is not all zeros
        transport: *local
        parameters:
          lan: *lan
          get: device/guid
          expect: {matches: '[1-9a-f]'}
      - cmd: ipmi
        name: Auth capabilities of this channel offer IPMI 2.0
        transport: *local
        parameters:
          lan: *lan
          get: channel/14/auth/ipmi-v20
          expect: {eq: true}
      - cmd: ipmi
        name: Auth capabilities of LAN channel 1 offer IPMI 2.0
        transport: *local
        parameters:
          lan: *lan
          get: channel/1/auth/ipmi-v20
          expect: {eq: true}

  - name: Session Info
    steps:
      - cmd: ipmi
        name: Session info counts this session as active
        transport: *local
        parameters:
          lan: *lan
          get: session/active
          expect: {ge: 1}

  - name: Channel and User Information
    on-failure: continue
    steps:
      - cmd: ipmi
        name: LAN channel 1 allows Administrator sessions
        transport: *local
        parameters:
          lan: *lan
          get: channel/1/privilege-limit
          expect: {eq: administrator}
      - cmd: ipmi
        name: Channel 1 is an 802.3 LAN
        transport: *local
        parameters:
          lan: *lan
          get: channel/1/medium
          expect: {eq: 802.3-lan}
      - cmd: ipmi
        name: Channel 15 is the KCS host interface
        transport: *local
        parameters:
          lan: *lan
          get: channel/15/protocol
          expect: {eq: kcs}
      # OpenBMC keeps root in user ID 1.
      - cmd: ipmi
        name: User 1 is root
        transport: *local
        parameters:
          lan: *lan
          get: user/1/name
          expect: {eq: root}
      - cmd: ipmi
        name: User 1 has Administrator access on channel 1
        transport: *local
        parameters:
          lan: *lan
          get: user/1/privilege
          expect: {eq: administrator}
      # OpenBMC has 15 IPMI user IDs.
      - cmd: ipmi
        name: The BMC offers 15 user IDs
        transport: *local
        parameters:
          lan: *lan
          get: users/max
          expect: {eq: 15}
      - cmd: ipmi
        name: This channel offers cipher suite 17
        transport: *local
        parameters:
          lan: *lan
          get: channel/14/cipher-suites
          expect: {contains: 17}
      - cmd: ipmi
        name: LAN channel 1 offers cipher suite 17
        transport: *local
        parameters:
          lan: *lan
          get: channel/1/cipher-suites
          expect: {contains: 17}

  - name: System Info Parameters
    on-failure: continue
    steps:
      - cmd: ipmi
        name: System info parameter revision is 11h
        transport: *local
        parameters:
          lan: *lan
          raw: 0x06 0x59 0x00 0x00 0x00 0x00
          expect: {byte: 0, eq: 0x11}
      - cmd: ipmi
        name: System info is not left set-in-progress
        transport: *local
        parameters:
          lan: *lan
          get: system-info/set-in-progress
          expect: {eq: complete}
