name: "IPMI: LAN Configuration Commands (NetFn 0x0c)"
description: >-
  Verify Get LAN Configuration Parameters (0x0c 0x02) for key network
  parameters on channel 1: IP address (param 3), IP address source (param 4),
  MAC address (param 5), subnet mask (param 6), VLAN ID (param 20) and the
  RMCP+ messaging cipher suite entries (param 23).

defaults:
  local: &local
    proto: local
  lan: &lan
    host: "[[attributes.BMC]]"
    user: "[[attributes.BMCUser]]"
    password: "[[attributes.BMCPassword]]"
    cipher: 17

stages:
  - name: LAN Configuration - IP and Network
    on-failure: continue
    steps:
      - cmd: ipmi
        name: Channel 1 reports an IP address
        transport: *local
        parameters:
          lan: *lan
          get: lan/1/ip
          expect: {ne: 0.0.0.0}
      - cmd: ipmi
        name: Channel 1 reports a subnet mask
        transport: *local
        parameters:
          lan: *lan
          get: lan/1/netmask
          expect: {ne: 0.0.0.0}
      - cmd: ipmi
        name: Channel 1 reports a MAC address
        transport: *local
        parameters:
          lan: *lan
          get: lan/1/mac
          expect: {ne: "00:00:00:00:00:00"}
      - cmd: ipmi
        name: Channel 1 IP address source is static or DHCP
        transport: *local
        parameters:
          lan: *lan
          get: lan/1/ip-source
          expect: {matches: '^(static|dhcp)$'}

  - name: LAN Configuration - VLAN and Cipher
    on-failure: continue
    steps:
      - cmd: ipmi
        name: Channel 1 VLAN is off or a valid VLAN ID
        transport: *local
        parameters:
          lan: *lan
          get: lan/1/vlan
          expect: {matches: '^(off|[1-9][0-9]{0,3})$'}
      - cmd: ipmi
        name: Cipher suite entries parameter has revision 11h
        transport: *local
        parameters:
          lan: *lan
          raw: 0x0c 0x02 0x01 0x17 0x00 0x00
          expect: {byte: 0, eq: 0x11}
