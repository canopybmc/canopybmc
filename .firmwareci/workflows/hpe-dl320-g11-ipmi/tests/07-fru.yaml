name: "IPMI: FRU Inventory"
description: >-
  Verify FRU inventory commands (Table G-1, §34): Get FRU Inventory Area Info
  (10h) and Read FRU Data (11h). HPE ProLiant Gen11 has no physical FRU EEPROMs;
  fru-synthesizer builds FRU images from device-tree VPD (baseboard) and host
  SMBIOS (CPU/DIMM), fru-device publishes them via xyz.openbmc_project.FruDevice,
  and phosphor-ipmi-host's dbus-sdr handlers serve them over IPMI.
  FRU device 0 is the baseboard (Rack Mount chassis); it is available without the
  host. CPU/DIMM FRUs come from SMBIOS, so this test powers the host on and waits
  for the synthetic FRU files to appear before asserting on them.

defaults:
  local: &local
    proto: local
  lan: &lan
    host: "[[attributes.BMC]]"
    user: "[[attributes.BMCUser]]"
    password: "[[attributes.BMCPassword]]"
    cipher: 17
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: FRU Inventory Area Info and Read FRU Data
    on-failure: continue
    steps:
      - cmd: ipmi
        name: FRU device 0 has an inventory area
        transport: *local
        parameters:
          lan: *lan
          get: fru/0/size
          expect: {ne: 0}
      - cmd: ipmi
        name: FRU device 0 common header is format version 1
        transport: *local
        parameters:
          lan: *lan
          get: fru/0/header/version
          expect: {eq: 1}
      - cmd: ipmi
        name: FRU device 0 common header checksum is valid
        transport: *local
        parameters:
          lan: *lan
          get: fru/0/header/checksum-ok
          expect: {eq: true}

  - name: Baseboard FRU Values (device 0)
    on-failure: continue
    steps:
      # The chassis type is what makes the baseboard FRU device 0.
      - cmd: ipmi
        name: Baseboard chassis type is the board's
        transport: *local
        parameters:
          lan: *lan
          get: fru/0/chassis/type
          expect: {eq: "[[attributes.FRU.ChassisType]]"}
      - cmd: ipmi
        name: Baseboard reports a board manufacturer
        transport: *local
        parameters:
          lan: *lan
          get: fru/0/board/manufacturer
          expect: exists
      - cmd: ipmi
        name: Baseboard reports a board product
        transport: *local
        parameters:
          lan: *lan
          get: fru/0/board/product
          expect: exists
      - cmd: ipmi
        name: Baseboard reports a board serial number
        transport: *local
        parameters:
          lan: *lan
          get: fru/0/board/serial
          expect: exists

  - name: Power on host for SMBIOS-sourced FRU
    steps:
      - cmd: ipmi
        name: Host power on is accepted
        transport: *local
        parameters:
          lan: *lan
          set: chassis/power
          value: "on"
          expect: {completion: 0x00}

  - name: Wait for CPU and DIMM synthetic FRUs
    steps:
      # Restarts GxpChif when its push queue fills up, as the SMBIOS transfer then stalls.
      - cmd: shell
        name: fru-synthesizer has written a CPU and a DIMM FRU
        transport: *bmc
        options:
          timeout: 15m
        parameters:
          command: |
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full')
            until ls /etc/fru/254-*.fru.bin >/dev/null 2>&1 &&
                ls /etc/fru/255-*.fru.bin >/dev/null 2>&1; do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full')
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF"
                systemctl restart xyz.openbmc_project.GxpChif.service
                full=$now
              fi
              sleep 5
            done
            echo "CPU and DIMM FRUs written"
          expect:
            - regex: 'CPU and DIMM FRUs written'

  - name: Synthetic FRUs on the BMC
    on-failure: continue
    steps:
      - cmd: shell
        name: fru-synthesizer is active
        transport: *bmc
        parameters:
          command: systemctl is-active fru-synthesizer.service
          expect:
            - regex: '^active\s*$'
      - cmd: shell
        name: At least one CPU FRU (bus 254) generated from SMBIOS
        transport: *bmc
        parameters:
          command: ls -1 /etc/fru/254-*.fru.bin
          expect:
            - regex: '254-[0-9]+\.fru\.bin'
      - cmd: shell
        name: At least one DIMM FRU (bus 255) generated from SMBIOS
        transport: *bmc
        parameters:
          command: ls -1 /etc/fru/255-*.fru.bin
          expect:
            - regex: '255-[0-9]+\.fru\.bin'

  - name: IPMI serves baseboard, CPU and DIMM
    on-failure: continue
    steps:
      - cmd: ipmi
        name: At least two FRUs besides the baseboard have a product
        transport: *local
        parameters:
          lan: *lan
          get: fru/*/product/name
          where: {id: {ne: 0}, name: {matches: '\S'}}
          expect: {count: {ge: 2}}
      - cmd: ipmi
        name: A served FRU reports a product manufacturer
        transport: *local
        parameters:
          lan: *lan
          get: fru/*/product/manufacturer
          where: {manufacturer: {matches: '\S'}}
          expect: {count: {ge: 1}}
