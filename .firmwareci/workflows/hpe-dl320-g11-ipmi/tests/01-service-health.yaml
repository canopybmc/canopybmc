name: "Smoke: Service Health"
description: >-
  Verify that the IPMI services are running: the IPMI host daemon, the KCS
  bridge of the host interface and the IPMI SEL logger. Each step checks one
  systemd unit with systemctl is-active.

defaults:
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: Critical Services Running
    on-failure: continue
    steps:
      - cmd: shell
        name: IPMI host service is active
        transport: *bmc
        parameters:
          command: systemctl is-active phosphor-ipmi-host.service
          expect:
            - regex: '^active\s*$'
      - cmd: shell
        name: IPMI KCS service is active
        transport: *bmc
        parameters:
          command: systemctl is-active "[[attributes.IPMI.KCSUnit]]"
          expect:
            - regex: '^active\s*$'
      - cmd: shell
        name: IPMI SEL logger is active
        transport: *bmc
        parameters:
          command: systemctl is-active xyz.openbmc_project.Logging.IPMI
          expect:
            - regex: '^active\s*$'
