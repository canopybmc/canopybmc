name: "IPMI: DCMI Group Extension Commands (NetFn 0x2c, Group 0xDC)"
description: >-
  Verify DCMI 1.5 commands (group extension 0xDC): Get DCMI Capability Info,
  Get Management Controller ID String, Get DCMI Sensor Info, Get Temperature
  Reading, Get Power Reading and Get DCMI Configuration Parameters.
  Temperature commands query the baseboard entity (0x42), backed by the GXP
  temperature; this platform has no inlet air sensor.

  The asset tag and the power limit are exercised as set/get round trips. The
  test saves the asset tag first and checks that no power limit is active
  (Get Power Limit answers 0x80). The last stages write the asset tag back and
  deactivate the power limit again, also after a failure.

variables:
  ASSET_TAG_HEX: unsaved

defaults:
  local: &local
    proto: local
  lan: &lan
    host: "[[attributes.BMC]]"
    user: "[[attributes.BMCUser]]"
    password: "[[attributes.BMCPassword]]"
    cipher: 17
  restore: &restore
    # The ipmi step takes no stored variable in raw, so ipmitool writes the saved tag.
    - cmd: shell
      name: The saved asset tag is written back
      transport: *local
      parameters:
        command: |
          hex={{ ASSET_TAG_HEX }}
          [ "$hex" = unsaved ] && { echo "asset tag not saved, nothing to restore"; exit 0; }
          [ "$hex" = empty ] && hex=
          ipmi="ipmitool -I lanplus -H [[attributes.BMC]] -U [[attributes.BMCUser]] -P [[attributes.BMCPassword]] -C 17"
          $ipmi raw 0x2c 0x08 0xdc 0x00 0x00 >/dev/null || exit 1
          off=0
          while [ -n "$hex" ]; do
            chunk=$(printf '%s' "$hex" | cut -c1-32)
            hex=$(printf '%s' "$hex" | cut -c33-)
            n=$((${#chunk} / 2))
            $ipmi raw 0x2c 0x08 0xdc $off $n $(printf '%s' "$chunk" | sed 's/../0x& /g') >/dev/null || exit 1
            off=$((off + n))
          done
          $ipmi dcmi asset_tag
    - cmd: ipmi
      name: Deactivate Power Limit is accepted
      transport: *local
      parameters:
        lan: *lan
        raw: 0x2c 0x05 0xdc 0x00 0x00 0x00
        expect: {completion: 0x00}
    - cmd: ipmi
      name: No power limit is active again
      transport: *local
      parameters:
        lan: *lan
        raw: 0x2c 0x03 0xdc 0x00 0x00
        expect: {completion: 0x80}

stages:
  - name: Save DCMI Settings
    steps:
      - cmd: shell
        name: Save the current asset tag
        transport: *local
        parameters:
          command: |
            out=$(ipmitool -I lanplus -H [[attributes.BMC]] -U [[attributes.BMCUser]] -P [[attributes.BMCPassword]] -C 17 dcmi asset_tag 2>&1)
            case "$out" in
              *"out of range"*) echo empty; exit 0 ;;
              *"Asset tag"*) ;;
              *) printf '%s\n' "$out"; exit 1 ;;
            esac
            hex=$(printf '%s\n' "$out" | sed -n 's/^[ ]*Asset tag[ ]*:[ ]*//p' | head -1 | tr -d '\r\n' | od -An -tx1 | tr -d ' \n')
            echo "${hex:-empty}"
          variable: ASSET_TAG_HEX
          expect:
            - regex: '^(empty|[0-9a-f]+)\s*$'
      - cmd: ipmi
        name: No power limit is active (0x80)
        transport: *local
        parameters:
          lan: *lan
          raw: 0x2c 0x03 0xdc 0x00 0x00
          expect: {completion: 0x80}

  - name: DCMI Capability and Management Info
    on-failure: continue
    steps:
      - cmd: ipmi
        name: DCMI capabilities report version 1.5
        transport: *local
        parameters:
          lan: *lan
          get: dcmi/version
          expect: {eq: "1.5"}
      - cmd: ipmi
        name: Management controller ID is the board's
        transport: *local
        parameters:
          lan: *lan
          get: dcmi/controller-id
          expect: {eq: "[[attributes.IPMI.ControllerID]]"}

  - name: DCMI Sensor and Temperature
    on-failure: continue
    steps:
      - cmd: ipmi
        name: Baseboard temperature has one sensor record
        transport: *local
        parameters:
          lan: *lan
          raw: 0x2c 0x07 0xdc 0x01 0x42 0x01 0x01
          expect: [{byte: 1, eq: 1}, {byte: 2, eq: 1}]
      - cmd: ipmi
        name: Baseboard temperature reading is for instance 1
        transport: *local
        parameters:
          lan: *lan
          raw: 0x2c 0x10 0xdc 0x01 0x42 0x01 0x00
          expect: [{byte: 1, eq: 1}, {byte: 2, eq: 1}, {byte: 4, eq: 1}]

  - name: DCMI Asset Tag Round-Trip
    steps:
      - cmd: ipmi
        name: Set Asset Tag to FWCITAG1 answers its length 8
        transport: *local
        parameters:
          lan: *lan
          raw: 0x2c 0x08 0xdc 0x00 0x08 0x46 0x57 0x43 0x49 0x54 0x41 0x47 0x31
          expect: {byte: 1, eq: 8}
      - cmd: ipmi
        name: Get Asset Tag returns FWCITAG1
        transport: *local
        options: {on-failure: continue}
        parameters:
          lan: *lan
          get: dcmi/asset-tag
          expect: {eq: FWCITAG1}

  - name: DCMI Power
    on-failure: continue
    steps:
      - cmd: ipmi
        name: DCMI power reading is a number of watts
        transport: *local
        parameters:
          lan: *lan
          get: dcmi/power/current
          expect: {ge: 0}

  - name: DCMI Power Limit Round-Trip
    steps:
      - cmd: ipmi
        name: Set Power Limit to 800 W is accepted
        transport: *local
        parameters:
          lan: *lan
          raw: 0x2c 0x04 0xdc 0x00 0x00 0x00 0x00 0x20 0x03 0x70 0x17 0x00 0x00 0x00 0x00 0x01 0x00
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Activate Power Limit is accepted
        transport: *local
        parameters:
          lan: *lan
          raw: 0x2c 0x05 0xdc 0x01 0x00 0x00
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Get Power Limit reports 800 W
        transport: *local
        parameters:
          lan: *lan
          raw: 0x2c 0x03 0xdc 0x00 0x00
          expect: {byte: 4, len: 2, eq: 800}

  - name: DCMI Configuration
    on-failure: continue
    steps:
      - cmd: ipmi
        name: Configuration parameters answer for DCMI 1.5
        transport: *local
        parameters:
          lan: *lan
          raw: 0x2c 0x13 0xdc 0x01 0x00
          expect: [{byte: 1, eq: 1}, {byte: 2, eq: 5}]

  - name: Restore DCMI Settings
    on-failure: continue
    steps: *restore

  - name: Restore DCMI Settings after a failure
    run-condition: failure
    on-failure: continue
    steps: *restore
