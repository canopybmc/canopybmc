name: "IPMI: App - IPM Device Global Commands (NetFn 0x06)"
description: >-
  Verify IPM Device Global commands (Table G-1, §20): Get Device ID (01h),
  Get Self Test Results (04h), Get/Set ACPI Power State (07h/06h) and Get
  Device GUID (08h, the BMC device GUID). The test then powers the host on
  and checks Get System GUID (37h) once the BIOS has sent its SMBIOS tables.

  Get ACPI Power State (07h) is unsupported on HPE ProLiant Gen11 and answers
  0xFF. Set ACPI Power State (06h) is sent without a state change.

defaults:
  local: &local
    proto: local
  lan: &lan
    host: "[[attributes.BMC]]"
    user: "[[attributes.BMCUser]]"
    password: "[[attributes.BMCPassword]]"
    cipher: 17
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: Get Device ID
    on-failure: continue
    steps:
      - cmd: ipmi
        name: Get Device ID reports a device ID
        transport: *local
        parameters:
          lan: *lan
          get: device/device-id
          expect: exists
      - cmd: ipmi
        name: Get Device ID reports IPMI version 2.0
        transport: *local
        parameters:
          lan: *lan
          get: device/ipmi-version
          expect: {eq: "2.0"}

  - name: Get Self Test Results
    steps:
      - cmd: ipmi
        name: Self test passed (55h)
        transport: *local
        parameters:
          lan: *lan
          get: device/self-test
          expect: {eq: passed}

  - name: ACPI Power State
    on-failure: continue
    steps:
      # Unsupported on HPE ProLiant Gen11 on purpose: ipmid answers 0xFF.
      - cmd: ipmi
        name: Get ACPI Power State is rejected with 0xFF
        transport: *local
        parameters:
          lan: *lan
          get: device/acpi-system
          expect: {completion: 0xff}
      - cmd: ipmi
        name: Set ACPI Power State without a change is accepted
        transport: *local
        parameters:
          lan: *lan
          raw: 0x06 0x06 0x00 0x00
          expect: {completion: 0x00}

  - name: Get Device GUID
    steps:
      - cmd: ipmi
        name: Device GUID is not all zeros
        transport: *local
        parameters:
          lan: *lan
          get: device/device-guid
          expect: {ne: "00000000-0000-0000-0000-000000000000"}

  - name: Wait for SMBIOS System GUID source
    steps:
      - cmd: ipmi
        name: Host power on is accepted
        transport: *local
        parameters:
          lan: *lan
          set: chassis/power
          value: "on"
          expect: {completion: 0x00}
      # Restarts GxpChif when its push queue fills up, as the transfer then stalls.
      - cmd: shell
        name: smbios-mdr publishes a non-zero System UUID
        transport: *bmc
        options:
          timeout: 15m
        parameters:
          command: |
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full')
            until busctl get-property xyz.openbmc_project.Smbios.MDR_V2 \
                /xyz/openbmc_project/inventory/system/chassis/motherboard/bios \
                xyz.openbmc_project.Common.UUID UUID 2>/dev/null | grep -qiE '[1-9a-f]'; do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full')
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF"
                systemctl restart xyz.openbmc_project.GxpChif.service
                full=$now
              fi
              sleep 5
            done
            echo "System GUID source ready"
          expect:
            - regex: 'System GUID source ready'

  - name: Get System GUID
    steps:
      - cmd: ipmi
        name: System GUID from SMBIOS is not all zeros
        transport: *local
        parameters:
          lan: *lan
          get: device/guid
          expect: {matches: '[1-9a-f]'}
