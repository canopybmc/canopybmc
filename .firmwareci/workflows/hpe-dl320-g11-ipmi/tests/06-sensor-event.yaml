name: "IPMI: Sensor Commands (NetFn 0x04)"
description: >-
  Verify Sensor NetFn commands (Table G-1, §35): Get Sensor Reading (2Dh), Get
  Sensor Threshold (27h) and Get Sensor Type (2Fh).

  A set of sensors is BMC-served and present with the host powered off: both
  PSUs and the SoC temperature. The host is powered off first so that this
  baseline is asserted in a known off state, and the SDR record count is
  stored. CPU, DIMM and fan sensors only enter the SDR after the host is up,
  so with the host on the record count is at least the baseline and the fan
  sensors are present.

  Sensor numbers are assigned dynamically by dbus-sdr, so the SoC temperature
  sensor number is resolved from the SDR at run time and reused by the Get
  Sensor Threshold and Get Sensor Type requests.

variables:
  SOC_SENSOR: unresolved

defaults:
  local: &local
    proto: local
  lan: &lan
    host: "[[attributes.BMC]]"
    user: "[[attributes.BMCUser]]"
    password: "[[attributes.BMCPassword]]"
    cipher: 17

stages:
  - name: Power Off Host
    steps:
      - cmd: ipmi
        name: Host power off is accepted
        transport: *local
        parameters:
          lan: *lan
          set: chassis/power
          value: "off"
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Chassis power reads off
        transport: *local
        parameters:
          lan: *lan
          get: chassis/power
          retry: {timeout: 2m, interval: 5s}
          expect: {eq: "off"}

  - name: Baseline Sensors (host off)
    steps:
      - cmd: ipmi
        name: SDR holds records with the host off
        transport: *local
        parameters:
          lan: *lan
          get: sdr/records
          retry: {timeout: 5m, interval: 5s}
          expect: {ge: 1}
          variable: SDR_RECORDS
      - cmd: ipmi
        name: PSU1 sensors are present with the host off
        transport: *local
        options: {on-failure: continue}
        parameters:
          lan: *lan
          get: sdr/*/name
          where: {name: {matches: "[[attributes.IPMI.Sensors.PSU1]]"}}
          expect: {count: {ge: 1}}
      - cmd: ipmi
        name: PSU2 sensors are present with the host off
        transport: *local
        options: {on-failure: continue}
        parameters:
          lan: *lan
          get: sdr/*/name
          where: {name: {matches: "[[attributes.IPMI.Sensors.PSU2]]"}}
          expect: {count: {ge: 1}}
      - cmd: ipmi
        name: SoC temperature is present with the host off
        transport: *local
        options: {on-failure: continue}
        parameters:
          lan: *lan
          get: sdr/*/name
          where: {name: {matches: "[[attributes.IPMI.Sensors.SoCTemp]]"}}
          expect: {count: {ge: 1}}

  - name: Sensor Commands
    steps:
      # A raw request takes no stored variable, so the sensor number goes through ipmitool.
      - cmd: shell
        name: Resolve the SoC temperature sensor number from the SDR
        transport: *local
        parameters:
          command: >-
            ipmitool -I lanplus -H [[attributes.BMC]] -U [[attributes.BMCUser]]
            -P [[attributes.BMCPassword]] -C 17 sdr elist
            | awk -F'|' -v s='[[attributes.IPMI.Sensors.SoCTemp]]'
            '$1 ~ s { gsub(/[^0-9a-fA-F]/, "", $2); print "0x" $2; exit }'
          variable: SOC_SENSOR
          expect:
            - regex: '^0x[0-9a-fA-F]{2}\s*$'
      - cmd: ipmi
        name: Get Sensor Reading reads the SoC temperature
        transport: *local
        options: {on-failure: continue}
        parameters:
          lan: *lan
          get: sdr/*/reading
          where: {name: {matches: "[[attributes.IPMI.Sensors.SoCTemp]]"}}
          expect: [{count: {ge: 1}}, {ge: 0}]
      - cmd: shell
        name: Get Sensor Threshold returns the mask and six thresholds
        transport: *local
        options: {on-failure: continue}
        parameters:
          command: >-
            ipmitool -I lanplus -H [[attributes.BMC]] -U [[attributes.BMCUser]]
            -P [[attributes.BMCPassword]] -C 17 raw 0x04 0x27 {{ SOC_SENSOR }}
          expect:
            - regex: '^\s*[0-9a-f]{2}( [0-9a-f]{2}){6}\s*$'
      - cmd: shell
        name: Get Sensor Type reports a temperature threshold sensor
        transport: *local
        options: {on-failure: continue}
        parameters:
          command: >-
            ipmitool -I lanplus -H [[attributes.BMC]] -U [[attributes.BMCUser]]
            -P [[attributes.BMCPassword]] -C 17 raw 0x04 0x2f {{ SOC_SENSOR }}
          expect:
            - regex: '^\s*01 01\s*$'

  - name: Power On Host
    steps:
      - cmd: ipmi
        name: Host power on is accepted
        transport: *local
        parameters:
          lan: *lan
          set: chassis/power
          value: "on"
          expect: {completion: 0x00}
      - cmd: ipmi
        name: Chassis power reads on
        transport: *local
        parameters:
          lan: *lan
          get: chassis/power
          retry: {timeout: 8m, interval: 5s}
          expect: {eq: "on"}

  - name: Sensors With Host On
    on-failure: continue
    steps:
      - cmd: ipmi
        name: PSU1 sensors are still present
        transport: *local
        parameters:
          lan: *lan
          get: sdr/*/name
          where: {name: {matches: "[[attributes.IPMI.Sensors.PSU1]]"}}
          expect: {count: {ge: 1}}
      - cmd: ipmi
        name: PSU2 sensors are still present
        transport: *local
        parameters:
          lan: *lan
          get: sdr/*/name
          where: {name: {matches: "[[attributes.IPMI.Sensors.PSU2]]"}}
          expect: {count: {ge: 1}}
      - cmd: ipmi
        name: SoC temperature is still present
        transport: *local
        parameters:
          lan: *lan
          get: sdr/*/name
          where: {name: {matches: "[[attributes.IPMI.Sensors.SoCTemp]]"}}
          expect: {count: {ge: 1}}
      - cmd: ipmi
        name: Fan sensors are present with the host on
        transport: *local
        parameters:
          lan: *lan
          get: sdr/*/name
          where: {name: {matches: "[[attributes.IPMI.Sensors.Fan]]"}}
          expect: {count: {ge: 1}}
      - cmd: ipmi
        name: SDR record count is at least the host-off baseline
        transport: *local
        parameters:
          lan: *lan
          get: sdr/records
          expect: {ge: "{{ SDR_RECORDS }}"}
