name: "IPMI: SDR Repository Commands (NetFn 0x0a)"
description: >-
  Verify SDR Repository commands (Table G-1, §33): Get SDR Repository Info
  (20h), Get SDR Repository Allocation Info (21h), Reserve SDR Repository
  (22h), Get SDR (23h, first record header) and Get SDR Repository Time
  (28h, not implemented on this BMC), and that the sensors of the SDR can be
  listed.

defaults:
  local: &local
    proto: local
  lan: &lan
    host: "[[attributes.BMC]]"
    user: "[[attributes.BMCUser]]"
    password: "[[attributes.BMCPassword]]"
    cipher: 17

stages:
  - name: SDR Repository Commands
    on-failure: continue
    steps:
      - cmd: ipmi
        name: SDR repository is version 1.5
        transport: *local
        parameters:
          lan: *lan
          get: sdr/version
          expect: {eq: "1.5"}
      - cmd: ipmi
        name: SDR repository holds records
        transport: *local
        parameters:
          lan: *lan
          get: sdr/records
          expect: {ge: 1}
      # Byte 8 is the last byte of the reply, so the check needs the whole reply.
      - cmd: ipmi
        name: SDR allocation info answers with all nine bytes
        transport: *local
        parameters:
          lan: *lan
          raw: 0x0a 0x21
          expect: {byte: 8, ge: 0}
      - cmd: ipmi
        name: Reserve SDR Repository returns a reservation
        transport: *local
        parameters:
          lan: *lan
          get: sdr/reservation
          expect: {ne: 0}
      - cmd: ipmi
        name: First SDR record carries SDR version 1.5
        transport: *local
        parameters:
          lan: *lan
          get: sdr-record/0/version
          expect: {eq: "1.5"}
      # Not implemented on this BMC: ipmid answers 0xC1.
      - cmd: ipmi
        name: Get SDR Repository Time is rejected with 0xC1
        transport: *local
        parameters:
          lan: *lan
          get: sdr/time
          expect: {completion: 0xc1}
      - cmd: ipmi
        name: The sensors of the SDR can be listed
        transport: *local
        parameters:
          lan: *lan
          get: sdr/*/name
          expect: {count: {ge: 1}}
