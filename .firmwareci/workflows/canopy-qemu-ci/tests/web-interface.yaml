name: "Web: Interface Accessibility"
description: >-
  Validate bmcweb service status, HTTPS connectivity, TLS certificate,
  and Redfish service root accessibility from the test runner.

on-failure: continue

defaults:
  transport: &bmc_ssh
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
      port: "[[attributes.SSHPort]]"
  local: &local
    proto: local
  anonymous: &anonymous
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth: {mode: none}

stages:
  - name: Wait for BMC
    steps:
      # The SSH transport does not retry a refused connection, and the QEMU
      # port forward accepts before the BMC listens. Once Redfish answers, SSH
      # is up too.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
          auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

  - name: bmcweb Service
    steps:
      - cmd: shell
        name: bmcweb is active
        transport: *bmc_ssh
        parameters:
          command: systemctl is-active bmcweb
          expect:
            - regex: '^active$'
      - cmd: shell
        name: bmcweb is enabled
        transport: *bmc_ssh
        parameters:
          command: systemctl is-enabled bmcweb
          expect:
            - regex: '^enabled$'

  - name: HTTPS Connectivity
    steps:
      - cmd: redfish
        name: HTTPS port answers without login
        transport: *local
        parameters:
          <<: *anonymous
          validate: request
          request: {method: GET, path: /redfish/v1, status: 200}
      # No native step reads the server certificate.
      - cmd: shell
        name: TLS certificate present
        transport: *local
        options: {timeout: 15s}
        parameters:
          command: echo | openssl s_client -connect [[attributes.BMC]]:[[attributes.RedfishPort]] 2>/dev/null | grep -c 'BEGIN CERTIFICATE'
          expect:
            - regex: '^1$'

  - name: Redfish Service Root
    steps:
      - cmd: redfish
        name: Redfish v1 reports its RedfishVersion
        transport: *local
        parameters:
          <<: *anonymous
          validate: inventory
          inventory:
            rules:
              - {path: /redfish/v1, prop: RedfishVersion, op: exists}
      - cmd: redfish
        name: Redfish requires authentication
        transport: *local
        parameters:
          <<: *anonymous
          validate: request
          request: {method: GET, path: /redfish/v1/Systems, status: 401}
