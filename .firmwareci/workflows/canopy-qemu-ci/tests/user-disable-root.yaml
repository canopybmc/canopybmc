name: "User: Disable Root Account"
description: >-
  Verify root account can be safely disabled and re-enabled using a
  backup administrator account. CRITICAL: never disable root without
  a backup admin, it locks out SSH and Redfish completely. The re-enable
  and the removal of the backup admin also run after a failure.
  BMC-only, no host power required.

defaults:
  local: &local
    proto: local
  root: &root
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
    validate: request
  ciadmin: &ciadmin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth: {user: ciadmin, password: Adm1nBack9}
    validate: request
  delete_ciadmin: &delete_ciadmin
    cmd: redfish
    name: Delete ciadmin if it exists
    transport: *local
    parameters:
      <<: *root
      request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/ciadmin, status: [200, 204, 404]}
  restore: &restore
    - cmd: redfish
      name: Re-enable root via ciadmin
      transport: *local
      parameters:
        <<: *ciadmin
        request:
          method: PATCH
          path: "/redfish/v1/AccountService/Accounts/[[attributes.BMCUser]]"
          body: {Enabled: true}
          status: [200, 204]
    - *delete_ciadmin

stages:
  - name: Wait for BMC
    steps:
      # Waits on Redfish itself: the QEMU port forward accepts before the BMC listens.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *root
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

  - name: Create Backup Admin
    steps:
      - *delete_ciadmin
      - cmd: redfish
        name: Create ciadmin backup administrator
        transport: *local
        parameters:
          <<: *root
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: ciadmin, Password: Adm1nBack9, RoleId: Administrator, Enabled: true}
            status: 201
      - cmd: redfish
        name: Verify ciadmin can authenticate
        transport: *local
        parameters:
          <<: *ciadmin
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 200}

  - name: Disable Root
    steps:
      - cmd: redfish
        name: Disable root via ciadmin
        transport: *local
        parameters:
          <<: *ciadmin
          request:
            method: PATCH
            path: "/redfish/v1/AccountService/Accounts/[[attributes.BMCUser]]"
            body: {Enabled: false}
            status: [200, 204]
      - cmd: redfish
        name: Verify root is disabled
        transport: *local
        parameters:
          <<: *ciadmin
          request:
            method: GET
            path: "/redfish/v1/AccountService/Accounts/[[attributes.BMCUser]]"
            status: 200
            rules:
              - {prop: Enabled, op: eq, value: "false"}
      - cmd: redfish
        name: Root cannot login (HTTP 401)
        transport: *local
        parameters:
          <<: *root
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 401}

  - name: Re-enable Root
    steps:
      - cmd: redfish
        name: Re-enable root via ciadmin
        transport: *local
        parameters:
          <<: *ciadmin
          request:
            method: PATCH
            path: "/redfish/v1/AccountService/Accounts/[[attributes.BMCUser]]"
            body: {Enabled: true}
            status: [200, 204]
      - cmd: redfish
        name: Root can login again (HTTP 200)
        transport: *local
        parameters:
          <<: *root
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 200}

  # FirmwareCI has no stage that runs after both a pass and a failure, so the
  # same steps run in a normal last stage and in a failure stage.
  - name: Cleanup
    on-failure: continue
    steps: *restore

  - name: Cleanup after a failure
    run-condition: failure
    on-failure: continue
    steps: *restore
