name: "User: Session Management"
description: >-
  Verify Redfish session creation, token-based authentication, and
  session deletion. Creates a session, reads Systems, Chassis and the
  Manager with a session token, checks the session's user, deletes the
  session, and verifies that it is gone and that a deleted session's token
  is refused. BMC-only, no host power required.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
    validate: request
  # The step opens a session, sends its X-Auth-Token and deletes the session.
  token: &token
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]", mode: session}
    validate: request

stages:
  - name: Wait for BMC
    steps:
      # Waits on Redfish itself: the QEMU port forward accepts before the BMC listens.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

  - name: Session Lifecycle
    steps:
      - cmd: redfish
        name: Create a session
        transport: *local
        parameters:
          <<: *admin
          auth: {mode: none}
          request:
            method: POST
            path: /redfish/v1/SessionService/Sessions
            body: {UserName: "[[attributes.BMCUser]]", Password: "[[attributes.BMCPassword]]"}
            status: 201
            rules:
              - {header: Location, op: matches, value: "^/redfish/v1/SessionService/Sessions/.", variable: SESSION}

      - cmd: redfish
        name: Token auth reads Systems
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *token
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 200}
      - cmd: redfish
        name: Token auth reads Chassis
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *token
          request: {method: GET, path: /redfish/v1/Chassis, status: 200}
      - cmd: redfish
        name: Token auth reads Managers
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *token
          request: {method: GET, path: "[[attributes.RedfishManager]]", status: 200}

      - cmd: redfish
        name: The session belongs to its user
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          request:
            method: GET
            path: "{{ SESSION }}"
            status: 200
            rules:
              - {prop: UserName, op: eq, value: "[[attributes.BMCUser]]"}

      - cmd: redfish
        name: Delete the session
        transport: *local
        parameters:
          <<: *admin
          request: {method: DELETE, path: "{{ SESSION }}", status: 200}
      - cmd: redfish
        name: The deleted session is gone
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          request: {method: GET, path: "{{ SESSION }}", status: 404}

      # No native step can store or send a session token, so this check keeps
      # curl: it opens its own session, uses the token, deletes the session
      # with it and uses the token again.
      - cmd: shell
        name: A deleted session's token is refused
        transport: *local
        options: {timeout: 60s, on-failure: continue}
        parameters:
          command: |
            B="https://[[attributes.BMC]]:[[attributes.RedfishPort]]"
            H=$(curl -sk -D - -o /dev/null -H 'Content-Type: application/json' \
              -d '{"UserName":"[[attributes.BMCUser]]","Password":"[[attributes.BMCPassword]]"}' \
              "$B/redfish/v1/SessionService/Sessions" | tr -d '\r')
            T=$(echo "$H" | awk 'tolower($1) == "x-auth-token:" {print $2}')
            L=$(echo "$H" | awk 'tolower($1) == "location:" {print $2}')
            get() { curl -sk -o /dev/null -w '%{http_code}' -H "X-Auth-Token: $T" "$@"; }
            before=$(get "$B[[attributes.RedfishSystem]]")
            delete=$(get -X DELETE "$B$L")
            after=$(get "$B[[attributes.RedfishSystem]]")
            echo "before=$before delete=$delete after=$after"
          expect:
            - regex: '^before=200 delete=200 after=401$'
