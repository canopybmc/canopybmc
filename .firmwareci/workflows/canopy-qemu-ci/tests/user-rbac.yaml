name: "User: Role-Based Access Control"
description: >-
  Verify RBAC enforcement for Administrator, Operator, and ReadOnly roles.
  Tests that ReadOnly and Operator users can read resources but cannot
  create or modify other user accounts. BMC-only, no host power required.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
    validate: request
  # Removes leftovers of an earlier run, the test users, and users that a
  # refused request created by mistake.
  cleanup: &cleanup
    - cmd: redfish
      name: Delete readonlyuser if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/readonlyuser, status: [200, 204, 404]}
    - cmd: redfish
      name: Delete operatoruser if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/operatoruser, status: [200, 204, 404]}
    - cmd: redfish
      name: Delete shouldfail if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/shouldfail, status: [200, 204, 404]}
    - cmd: redfish
      name: Delete shouldfail2 if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/shouldfail2, status: [200, 204, 404]}

stages:
  - name: Wait for BMC
    steps:
      # Waits on Redfish itself: the QEMU port forward accepts before the BMC listens.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

  - name: Remove Leftovers
    steps: *cleanup

  - name: Create Test Users
    steps:
      - cmd: redfish
        name: Create readonlyuser with ReadOnly role
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: readonlyuser, Password: R3adOnly9, RoleId: ReadOnly, Enabled: true}
            status: 201
      - cmd: redfish
        name: Create operatoruser with Operator role
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: operatoruser, Password: Op3rator9, RoleId: Operator, Enabled: true}
            status: 201

  - name: ReadOnly Access Tests
    on-failure: continue
    steps:
      - cmd: redfish
        name: ReadOnly can read Systems (HTTP 200)
        transport: *local
        parameters:
          <<: *admin
          auth: {user: readonlyuser, password: R3adOnly9}
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 200}
      - cmd: redfish
        name: ReadOnly cannot create users (HTTP 403)
        transport: *local
        parameters:
          <<: *admin
          auth: {user: readonlyuser, password: R3adOnly9}
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: shouldfail, Password: F4ilPass9, RoleId: ReadOnly, Enabled: true}
            status: 403
      # Targets operatoruser, not root: if the check fails, root stays usable.
      - cmd: redfish
        name: ReadOnly cannot modify other accounts (HTTP 403)
        transport: *local
        parameters:
          <<: *admin
          auth: {user: readonlyuser, password: R3adOnly9}
          request:
            method: PATCH
            path: /redfish/v1/AccountService/Accounts/operatoruser
            body: {Enabled: false}
            status: 403

  - name: Operator Access Tests
    on-failure: continue
    steps:
      - cmd: redfish
        name: Operator can read Systems (HTTP 200)
        transport: *local
        parameters:
          <<: *admin
          auth: {user: operatoruser, password: Op3rator9}
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 200}
      - cmd: redfish
        name: Operator cannot create users (HTTP 403)
        transport: *local
        parameters:
          <<: *admin
          auth: {user: operatoruser, password: Op3rator9}
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: shouldfail2, Password: F4ilPass8, RoleId: ReadOnly, Enabled: true}
            status: 403

  - name: Wrong Password Test
    steps:
      - cmd: redfish
        name: Wrong password returns 401
        transport: *local
        parameters:
          <<: *admin
          auth: {user: readonlyuser, password: WrongPass99}
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 401}

  # FirmwareCI has no stage that runs after both a pass and a failure, so the
  # same steps run in a normal last stage and in a failure stage.
  - name: Cleanup
    on-failure: continue
    steps: *cleanup

  - name: Cleanup after a failure
    run-condition: failure
    on-failure: continue
    steps: *cleanup
