name: "User: CRUD Operations"
description: >-
  Verify user create, read, update, delete lifecycle via Redfish.
  Tests account creation, login verification, role change, password
  change, disable/enable, and deletion. BMC-only, no host power required.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
    validate: request
  delete_testuser: &delete_testuser
    cmd: redfish
    name: Delete testuser if it exists
    transport: *local
    parameters:
      <<: *admin
      request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/testuser, status: [200, 204, 404]}

stages:
  - name: Wait for BMC
    steps:
      # Waits on Redfish itself: the QEMU port forward accepts before the BMC listens.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

  - name: Create User
    steps:
      - *delete_testuser
      - cmd: redfish
        name: Create testuser with Administrator role
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: testuser, Password: T3stPass99, RoleId: Administrator, Enabled: true}
            status: 201

  - name: Read User
    on-failure: continue
    steps:
      - cmd: redfish
        name: testuser exists
        transport: *local
        parameters:
          <<: *admin
          request:
            method: GET
            path: /redfish/v1/AccountService/Accounts/testuser
            status: 200
            rules:
              - {prop: UserName, op: eq, value: testuser}
      - cmd: redfish
        name: testuser is Administrator
        transport: *local
        parameters:
          <<: *admin
          request:
            method: GET
            path: /redfish/v1/AccountService/Accounts/testuser
            status: 200
            rules:
              - {prop: RoleId, op: eq, value: Administrator}
      - cmd: redfish
        name: testuser is enabled
        transport: *local
        parameters:
          <<: *admin
          request:
            method: GET
            path: /redfish/v1/AccountService/Accounts/testuser
            status: 200
            rules:
              - {prop: Enabled, op: eq, value: "true"}
      - cmd: redfish
        name: testuser is not locked
        transport: *local
        parameters:
          <<: *admin
          request:
            method: GET
            path: /redfish/v1/AccountService/Accounts/testuser
            status: 200
            rules:
              - {prop: Locked, op: eq, value: "false"}
      - cmd: redfish
        name: testuser can authenticate
        transport: *local
        parameters:
          <<: *admin
          auth: {user: testuser, password: T3stPass99}
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 200}

  - name: Modify Role
    steps:
      - cmd: redfish
        name: Change testuser role to Operator
        transport: *local
        parameters:
          <<: *admin
          request:
            method: PATCH
            path: /redfish/v1/AccountService/Accounts/testuser
            body: {RoleId: Operator}
            status: [200, 204]
      - cmd: redfish
        name: Verify role changed to Operator
        transport: *local
        parameters:
          <<: *admin
          request:
            method: GET
            path: /redfish/v1/AccountService/Accounts/testuser
            status: 200
            rules:
              - {prop: RoleId, op: eq, value: Operator}

  - name: Modify Password
    steps:
      - cmd: redfish
        name: Change testuser password
        transport: *local
        parameters:
          <<: *admin
          request:
            method: PATCH
            path: /redfish/v1/AccountService/Accounts/testuser
            body: {Password: N3wPass88}
            status: [200, 204]
      - cmd: redfish
        name: New password works
        transport: *local
        parameters:
          <<: *admin
          auth: {user: testuser, password: N3wPass88}
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 200}
      - cmd: redfish
        name: Old password fails
        transport: *local
        parameters:
          <<: *admin
          auth: {user: testuser, password: T3stPass99}
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 401}

  - name: Disable and Re-enable
    steps:
      - cmd: redfish
        name: Disable testuser
        transport: *local
        parameters:
          <<: *admin
          request:
            method: PATCH
            path: /redfish/v1/AccountService/Accounts/testuser
            body: {Enabled: false}
            status: [200, 204]
      - cmd: redfish
        name: Disabled user cannot login
        transport: *local
        parameters:
          <<: *admin
          auth: {user: testuser, password: N3wPass88}
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 401}
      - cmd: redfish
        name: Re-enable testuser
        transport: *local
        parameters:
          <<: *admin
          request:
            method: PATCH
            path: /redfish/v1/AccountService/Accounts/testuser
            body: {Enabled: true}
            status: [200, 204]
      - cmd: redfish
        name: Re-enabled user can login
        transport: *local
        parameters:
          <<: *admin
          auth: {user: testuser, password: N3wPass88}
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 200}

  - name: Delete User
    steps:
      - cmd: redfish
        name: Delete testuser
        transport: *local
        parameters:
          <<: *admin
          request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/testuser, status: 200}
      - cmd: redfish
        name: Deleted user returns 404
        transport: *local
        parameters:
          <<: *admin
          request: {method: GET, path: /redfish/v1/AccountService/Accounts/testuser, status: 404}

  # A passing run deletes testuser in the stage above.
  - name: Cleanup after a failure
    run-condition: failure
    steps:
      - *delete_testuser
