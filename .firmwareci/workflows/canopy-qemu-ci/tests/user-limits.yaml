name: "User: Account Limits"
description: >-
  Test account creation and input validation: create three ReadOnly users
  and log in with each, refuse a duplicate user name, an invalid role and
  a missing password, and protect the root account from deletion.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
    validate: request
  # Removes leftovers of an earlier run and the users this run created,
  # including users that a refused request created by mistake.
  cleanup: &cleanup
    - cmd: redfish
      name: Delete limituser01 if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/limituser01, status: [200, 204, 404]}
    - cmd: redfish
      name: Delete limituser02 if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/limituser02, status: [200, 204, 404]}
    - cmd: redfish
      name: Delete limituser03 if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/limituser03, status: [200, 204, 404]}
    - cmd: redfish
      name: Delete invalidrole if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/invalidrole, status: [200, 204, 404]}
    - cmd: redfish
      name: Delete nopassuser if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/nopassuser, status: [200, 204, 404]}

stages:
  - name: Wait for BMC
    steps:
      # Waits on Redfish itself: the QEMU port forward accepts before the BMC listens.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

  - name: Remove Leftovers
    steps: *cleanup

  - name: Create Multiple Users
    steps:
      - cmd: redfish
        name: Create limituser01 (ReadOnly)
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: limituser01, Password: T3stPass99, RoleId: ReadOnly, Enabled: true}
            status: 201
      - cmd: redfish
        name: Create limituser02 (ReadOnly)
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: limituser02, Password: T3stPass99, RoleId: ReadOnly, Enabled: true}
            status: 201
      - cmd: redfish
        name: Create limituser03 (ReadOnly)
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: limituser03, Password: T3stPass99, RoleId: ReadOnly, Enabled: true}
            status: 201

  - name: Verify Created Users
    on-failure: continue
    steps:
      - cmd: redfish
        name: limituser01 can authenticate
        transport: *local
        parameters:
          <<: *admin
          auth: {user: limituser01, password: T3stPass99}
          request: {method: GET, path: /redfish/v1/AccountService, status: 200}
      - cmd: redfish
        name: limituser02 can authenticate
        transport: *local
        parameters:
          <<: *admin
          auth: {user: limituser02, password: T3stPass99}
          request: {method: GET, path: /redfish/v1/AccountService, status: 200}
      - cmd: redfish
        name: limituser03 can authenticate
        transport: *local
        parameters:
          <<: *admin
          auth: {user: limituser03, password: T3stPass99}
          request: {method: GET, path: /redfish/v1/AccountService, status: 200}
      # Members is a list of links, so the rule matches the account URIs in it.
      - cmd: redfish
        name: Account list contains all three users
        transport: *local
        parameters:
          <<: *admin
          request:
            method: GET
            path: /redfish/v1/AccountService/Accounts
            status: 200
            rules:
              - all:
                  - {prop: Members, op: matches, value: '/Accounts/limituser01\b'}
                  - {prop: Members, op: matches, value: '/Accounts/limituser02\b'}
                  - {prop: Members, op: matches, value: '/Accounts/limituser03\b'}

  - name: Input Validation
    on-failure: continue
    steps:
      # DMTF fixes no status for a duplicate; BMCs answer 400 or 409, a 500 is a fault.
      - cmd: redfish
        name: Duplicate username rejected
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: limituser01, Password: T3stPass99, RoleId: ReadOnly, Enabled: true}
            status: [400, 409]
      - cmd: redfish
        name: Invalid role rejected
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: invalidrole, Password: T3stPass99, RoleId: InvalidRole, Enabled: true}
            status: [400, 422]
      - cmd: redfish
        name: Missing password rejected
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: nopassuser, RoleId: ReadOnly, Enabled: true}
            status: [400, 422]

  - name: Root Account Protection
    steps:
      # bmcweb refuses to delete the logged-in user with 403; older bmcweb
      # passes the delete on and answers 405 when the user manager refuses it.
      - cmd: redfish
        name: Root account cannot be deleted
        transport: *local
        parameters:
          <<: *admin
          request: {method: DELETE, path: "/redfish/v1/AccountService/Accounts/[[attributes.BMCUser]]", status: [403, 405]}

  # FirmwareCI has no stage that runs after both a pass and a failure, so the
  # same steps run in a normal last stage and in a failure stage.
  - name: Cleanup
    on-failure: continue
    steps: *cleanup

  - name: Cleanup after a failure
    run-condition: failure
    on-failure: continue
    steps: *cleanup
