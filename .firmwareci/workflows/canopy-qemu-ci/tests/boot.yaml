name: "Smoke: Boot"
description: >-
  Verify the QEMU OpenBMC instance boots: Redfish answers, systemd finishes
  its startup, the OS release is Canopy, no unit has failed and the kernel
  logged no oops, BUG or panic.

on-failure: continue

defaults:
  transport: &bmc_ssh
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
      port: "[[attributes.SSHPort]]"

stages:
  - name: Wait for BMC
    steps:
      # The SSH transport does not retry a refused connection, and the QEMU
      # port forward accepts before the BMC listens. Once Redfish answers, SSH
      # is up too.
      - cmd: redfish
        name: Redfish service answers
        transport: {proto: local}
        parameters:
          host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
          auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}
      # is-system-running exits 1 when degraded; the failed-units check reports that.
      - cmd: shell
        name: systemd startup finished
        transport: *bmc_ssh
        options: {timeout: 10m}
        parameters:
          command: echo "$(systemctl is-system-running --wait)"
          expect:
            - regex: '^(running|degraded)$'

  - name: Verify Boot
    steps:
      - cmd: shell
        name: OS release is Canopy
        transport: *bmc_ssh
        parameters:
          command: cat /etc/os-release
          expect:
            - regex: '^ID="?canopy"?$'
      - cmd: shell
        name: No unexpected failed services
        transport: *bmc_ssh
        parameters:
          command: systemctl list-units --failed --no-pager
          expect:
            - regex: "0 loaded units listed"
      - cmd: shell
        name: The kernel logged no oops, BUG or panic
        transport: *bmc_ssh
        parameters:
          command: k=$(dmesg | grep -E 'Oops|BUG:|Kernel panic|Call Trace'); echo "${k:-none}"
          expect:
            - regex: '^none$'
