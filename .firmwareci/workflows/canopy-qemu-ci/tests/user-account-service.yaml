name: "User: AccountService Configuration"
description: >-
  Verify AccountService configuration, predefined roles, root account
  properties, session service defaults, and that LDAP, not ActiveDirectory,
  has a certificate endpoint. BMC-only test, no host power required.

on-failure: continue

defaults:
  local: &local
    proto: local
  inventory: &inventory
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
    validate: inventory
  request: &request
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
    validate: request

stages:
  - name: Wait for BMC
    steps:
      # Waits on Redfish itself: the QEMU port forward accepts before the BMC listens.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

  - name: AccountService Configuration
    steps:
      - cmd: redfish
        name: MinPasswordLength is 8
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService, prop: MinPasswordLength, op: eq, value: "8"}
      - cmd: redfish
        name: MaxPasswordLength is 20
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService, prop: MaxPasswordLength, op: eq, value: "20"}
      - cmd: redfish
        name: AccountLockoutThreshold is 0
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService, prop: AccountLockoutThreshold, op: eq, value: "0"}
      - cmd: redfish
        name: AccountLockoutDuration is 0
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService, prop: AccountLockoutDuration, op: eq, value: "0"}

  - name: Predefined Roles
    steps:
      - cmd: redfish
        name: 3 predefined roles exist
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService, collection: Roles, op: count, value: "3"}
      - cmd: redfish
        name: Administrator role exists
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Roles/Administrator, prop: RoleId, op: eq, value: Administrator}
      - cmd: redfish
        name: Administrator role has ConfigureManager
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Roles/Administrator, prop: AssignedPrivileges, op: contains, value: ConfigureManager}
      - cmd: redfish
        name: Administrator role has ConfigureUsers
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Roles/Administrator, prop: AssignedPrivileges, op: contains, value: ConfigureUsers}
      - cmd: redfish
        name: Operator role exists
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Roles/Operator, prop: RoleId, op: eq, value: Operator}
      - cmd: redfish
        name: Operator role has Login
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Roles/Operator, prop: AssignedPrivileges, op: contains, value: Login}
      - cmd: redfish
        name: Operator role has ConfigureSelf
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Roles/Operator, prop: AssignedPrivileges, op: contains, value: ConfigureSelf}
      - cmd: redfish
        name: Operator role has ConfigureComponents
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Roles/Operator, prop: AssignedPrivileges, op: contains, value: ConfigureComponents}
      - cmd: redfish
        name: ReadOnly role exists
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Roles/ReadOnly, prop: RoleId, op: eq, value: ReadOnly}
      - cmd: redfish
        name: ReadOnly role has Login
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Roles/ReadOnly, prop: AssignedPrivileges, op: contains, value: Login}
      - cmd: redfish
        name: ReadOnly role has ConfigureSelf
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Roles/ReadOnly, prop: AssignedPrivileges, op: contains, value: ConfigureSelf}

  - name: Root Account
    steps:
      - cmd: redfish
        name: root account exists
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: "/redfish/v1/AccountService/Accounts/[[attributes.BMCUser]]", prop: UserName, op: eq, value: "[[attributes.BMCUser]]"}
      - cmd: redfish
        name: root account is Administrator
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: "/redfish/v1/AccountService/Accounts/[[attributes.BMCUser]]", prop: RoleId, op: eq, value: Administrator}
      - cmd: redfish
        name: root account is enabled
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: "/redfish/v1/AccountService/Accounts/[[attributes.BMCUser]]", prop: Enabled, op: eq, value: "true"}
      - cmd: redfish
        name: root account is not locked
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: "/redfish/v1/AccountService/Accounts/[[attributes.BMCUser]]", prop: Locked, op: eq, value: "false"}

  - name: Session Service
    steps:
      - cmd: redfish
        name: SessionTimeout is 1800
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/SessionService, prop: SessionTimeout, op: eq, value: "1800"}
      - cmd: redfish
        name: Sessions collection accessible
        transport: *local
        parameters:
          <<: *inventory
          inventory:
            rules:
              - {path: /redfish/v1/SessionService/Sessions, prop: "Members@odata.count", op: exists}

  - name: LDAP and AD Endpoints
    steps:
      - cmd: redfish
        name: LDAP Certificates endpoint exists
        transport: *local
        parameters:
          <<: *request
          request: {method: GET, path: /redfish/v1/AccountService/LDAP/Certificates, status: 200}
      # bmcweb serves certificates for LDAP only, not for ActiveDirectory.
      - cmd: redfish
        name: ActiveDirectory has no Certificates endpoint
        transport: *local
        parameters:
          <<: *request
          request: {method: GET, path: /redfish/v1/AccountService/ActiveDirectory/Certificates, status: 404}
