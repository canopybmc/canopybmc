name: Redfish service root
description: >-
  The Redfish service root is complete: it reports a Redfish version and a
  well-formed UUID, the version document points at v1, and it links to
  systems, managers, chassis, message registries and the session and
  account services, each of which is served.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
    validate: inventory

stages:
  - name: Redfish service root
    steps:
      # Waits on Redfish itself, see test rule 4 in the README.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *admin
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: redfish
        name: The service root reports a Redfish 1.x version
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          inventory:
            rules:
              - {path: /redfish/v1, prop: RedfishVersion, op: matches, value: '^1\.[0-9]+\.[0-9]+$'}

      - cmd: redfish
        name: The service root carries a well-formed UUID
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          inventory:
            rules:
              - {path: /redfish/v1, prop: UUID, op: matches, value: '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'}

      - cmd: redfish
        name: The version document points at v1
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          inventory:
            rules:
              - {path: /redfish, prop: v1, op: eq, value: /redfish/v1/}

      - cmd: redfish
        name: The systems collection has a member
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          inventory:
            rules:
              - {path: /redfish/v1, collection: Systems, op: ge, value: "1"}

      - cmd: redfish
        name: The chassis collection has a member
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          inventory:
            rules:
              - {path: /redfish/v1, collection: Chassis, op: ge, value: "1"}

      - cmd: redfish
        name: Every chassis resource is served
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          inventory:
            rules:
              - {path: /redfish/v1, forEach: Chassis, prop: Id, op: exists}

      - cmd: redfish
        name: Every manager resource is served
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          inventory:
            rules:
              - {path: /redfish/v1, forEach: Managers, prop: Id, op: exists}

      - cmd: redfish
        name: Message registries are served
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          inventory:
            rules:
              - {path: /redfish/v1, collection: Registries, op: ge, value: "1"}

      - cmd: redfish
        name: The session service is served
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          inventory:
            rules:
              - {path: /redfish/v1/SessionService, prop: Id, op: exists}

      - cmd: redfish
        name: The account service is served
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          inventory:
            rules:
              - {path: /redfish/v1/AccountService, prop: Id, op: exists}

      - cmd: redfish
        name: The session timeout is within 30 seconds and 24 hours
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *admin
          inventory:
            rules:
              - {path: /redfish/v1/SessionService, prop: SessionTimeout, op: range, value: "30..86400"}
