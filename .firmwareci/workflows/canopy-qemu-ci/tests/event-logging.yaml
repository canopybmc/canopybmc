name: "Logging: Event Lifecycle"
description: >-
  Validate OpenBMC event logging over D-Bus: create events at the Critical,
  Warning and Informational levels, read the Critical entry back, delete it
  alone, delete the other two with DeleteAll, and confirm the logging
  service works after a restart.

defaults:
  transport: &bmc_ssh
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
      port: "[[attributes.SSHPort]]"
  delete_all: &delete_all
    cmd: shell
    name: Delete all log entries
    transport: *bmc_ssh
    parameters:
      command: >-
        busctl call xyz.openbmc_project.Logging /xyz/openbmc_project/logging
        xyz.openbmc_project.Collection.DeleteAll DeleteAll

stages:
  - name: Wait for BMC
    steps:
      # The SSH transport does not retry a refused connection, and the QEMU
      # port forward accepts before the BMC listens. Once Redfish answers, SSH
      # is up too.
      - cmd: redfish
        name: Redfish service answers
        transport: {proto: local}
        parameters:
          host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
          auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}
      # is-system-running exits 1 when degraded; this only waits for the
      # services to start, the checks below test them.
      - cmd: shell
        name: systemd startup finished
        transport: *bmc_ssh
        options: {timeout: 10m}
        parameters:
          command: echo "$(systemctl is-system-running --wait)"
          expect:
            - regex: '^(running|degraded)$'

  - name: Logging Service Running
    steps:
      - cmd: shell
        name: phosphor-log-manager is active
        transport: *bmc_ssh
        parameters:
          command: systemctl is-active xyz.openbmc_project.Logging
          expect:
            - regex: '^active$'
      - cmd: shell
        name: Logging on D-Bus
        transport: *bmc_ssh
        parameters:
          command: busctl list --no-pager
          expect:
            - regex: '^xyz\.openbmc_project\.Logging\s'

  # Each Create prints 'o "<entry path>"'; the path is stored, because entry
  # numbers depend on the entries the BMC logged before.
  - name: Create Test Events
    steps:
      - <<: *delete_all
        name: Delete leftover log entries
      - cmd: shell
        name: Create Critical event
        transport: *bmc_ssh
        parameters:
          command: >-
            busctl call xyz.openbmc_project.Logging /xyz/openbmc_project/logging
            xyz.openbmc_project.Logging.Create Create 'ssa{ss}'
            xyz.openbmc_project.Common.Error.InternalFailure
            xyz.openbmc_project.Logging.Entry.Level.Critical
            1 TEST_EVENT fwci_critical | sed -n 's/^o "\(.*\)"$/\1/p'
          variable: CRITICAL_ENTRY
          expect:
            - regex: '^/xyz/openbmc_project/logging/entry/[0-9]+$'
      - cmd: shell
        name: Create Warning event
        transport: *bmc_ssh
        parameters:
          command: >-
            busctl call xyz.openbmc_project.Logging /xyz/openbmc_project/logging
            xyz.openbmc_project.Logging.Create Create 'ssa{ss}'
            xyz.openbmc_project.Common.Error.Timeout
            xyz.openbmc_project.Logging.Entry.Level.Warning
            1 TEST_WARNING fwci_warning | sed -n 's/^o "\(.*\)"$/\1/p'
          variable: WARNING_ENTRY
          expect:
            - regex: '^/xyz/openbmc_project/logging/entry/[0-9]+$'
      - cmd: shell
        name: Create Informational event
        transport: *bmc_ssh
        parameters:
          command: >-
            busctl call xyz.openbmc_project.Logging /xyz/openbmc_project/logging
            xyz.openbmc_project.Logging.Create Create 'ssa{ss}'
            xyz.openbmc_project.Common.Error.InvalidArgument
            xyz.openbmc_project.Logging.Entry.Level.Informational
            1 TEST_INFO fwci_info | sed -n 's/^o "\(.*\)"$/\1/p'
          variable: INFO_ENTRY
          expect:
            - regex: '^/xyz/openbmc_project/logging/entry/[0-9]+$'

  - name: Verify Event Retrieval
    steps:
      - cmd: shell
        name: Critical entry has its Message
        transport: *bmc_ssh
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.Logging {{ CRITICAL_ENTRY }}
            xyz.openbmc_project.Logging.Entry Message
          expect:
            - regex: '^s "xyz\.openbmc_project\.Common\.Error\.InternalFailure"$'
      - cmd: shell
        name: Critical entry has its Severity
        transport: *bmc_ssh
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.Logging {{ CRITICAL_ENTRY }}
            xyz.openbmc_project.Logging.Entry Severity
          expect:
            - regex: '^s "xyz\.openbmc_project\.Logging\.Entry\.Level\.Critical"$'
      - cmd: shell
        name: Critical entry has a Timestamp
        transport: *bmc_ssh
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.Logging {{ CRITICAL_ENTRY }}
            xyz.openbmc_project.Logging.Entry Timestamp
          expect:
            - regex: '^t [0-9]+$'

  - name: Delete and Bulk Delete
    steps:
      - cmd: shell
        name: Delete the Critical entry
        transport: *bmc_ssh
        parameters:
          command: >-
            busctl call xyz.openbmc_project.Logging {{ CRITICAL_ENTRY }}
            xyz.openbmc_project.Object.Delete Delete
      # Counts the logging root, which is always listed, and the entry:
      # 1 means the service answered and the entry is gone.
      - cmd: shell
        name: The deleted entry is gone
        transport: *bmc_ssh
        parameters:
          command: >-
            busctl --list tree xyz.openbmc_project.Logging
            | grep -c -x -e /xyz/openbmc_project/logging -e {{ CRITICAL_ENTRY }}
          expect:
            - regex: '^1$'
      - <<: *delete_all
        name: DeleteAll remaining entries
      - cmd: shell
        name: DeleteAll removed the other test entries
        transport: *bmc_ssh
        parameters:
          command: >-
            busctl --list tree xyz.openbmc_project.Logging
            | grep -c -x -e /xyz/openbmc_project/logging
            -e {{ WARNING_ENTRY }} -e {{ INFO_ENTRY }}
          expect:
            - regex: '^1$'

  # The unit is Type=dbus, so systemctl restart returns once the new
  # process owns its bus name.
  - name: Service Restart
    steps:
      - cmd: shell
        name: Restart logging service
        transport: *bmc_ssh
        parameters:
          command: systemctl restart xyz.openbmc_project.Logging
      - cmd: shell
        name: Logging service active after restart
        transport: *bmc_ssh
        parameters:
          command: systemctl is-active xyz.openbmc_project.Logging
          expect:
            - regex: '^active$'
      - cmd: shell
        name: Logging on D-Bus after restart
        transport: *bmc_ssh
        parameters:
          command: busctl list --no-pager
          expect:
            - regex: '^xyz\.openbmc_project\.Logging\s'

  # A passing run deletes its entries in the stages above.
  - name: Cleanup after a failure
    run-condition: failure
    steps:
      - *delete_all
