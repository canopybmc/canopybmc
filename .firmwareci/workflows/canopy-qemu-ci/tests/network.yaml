name: "Network: Interface Validation"
description: >-
  Validate network interface configuration, IP assignment, gateway,
  loopback connectivity, and network service status on QEMU OpenBMC.

on-failure: continue

defaults:
  transport: &bmc_ssh
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
      port: "[[attributes.SSHPort]]"

stages:
  - name: Wait for BMC
    steps:
      # The SSH transport does not retry a refused connection, and the QEMU
      # port forward accepts before the BMC listens. Once Redfish answers, SSH
      # is up and eth0 is configured, because Redfish reaches the BMC over it.
      - cmd: redfish
        name: Redfish service answers
        transport: {proto: local}
        parameters:
          host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
          auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

  - name: Interface Configuration
    steps:
      - cmd: shell
        name: eth0 interface is UP
        transport: *bmc_ssh
        parameters:
          command: ip link show eth0
          expect:
            - regex: '\bUP\b'
      - cmd: shell
        name: eth0 has IPv4 address
        transport: *bmc_ssh
        parameters:
          command: ip addr show eth0
          expect:
            - regex: 'inet [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/'
      - cmd: shell
        name: Default gateway configured
        transport: *bmc_ssh
        parameters:
          command: ip route show default
          expect:
            - regex: 'default via [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'

  - name: Connectivity
    steps:
      - cmd: shell
        name: Loopback ping succeeds
        transport: *bmc_ssh
        parameters:
          command: ping -c 3 127.0.0.1
          expect:
            - regex: "3 packets transmitted, 3 packets received"

  - name: Network Services
    steps:
      - cmd: shell
        name: systemd-networkd is active
        transport: *bmc_ssh
        parameters:
          command: systemctl is-active systemd-networkd
          expect:
            - regex: '^active$'
