name: Redfish account lockout
description: >-
  With a lockout threshold of 3 failed logins and a duration of 60 seconds,
  three wrong passwords lock an account, the locked account is refused even
  with its right password, and it logs in again after the lockout ends. The
  test runs only on a BMC whose lockout starts turned off, and turns it off
  again at the end, so it never overwrites a policy someone set on purpose.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: Redfish account lockout
    steps:
      # Waits on Redfish itself, see test rule 4 in the README.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: redfish
        name: Account lockout starts turned off
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService, prop: AccountLockoutThreshold, op: eq, value: "0"}

      - cmd: redfish
        name: A leftover test account is removed
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/tslockout, status: [200, 204, 404]}

      - cmd: redfish
        name: A ReadOnly test account is created
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: tslockout, Password: Ts-L0ckout-26, RoleId: ReadOnly, Enabled: true}
            status: 201

      - cmd: redfish
        name: Lockout is set to 3 failed logins for 60 seconds
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: PATCH
            path: /redfish/v1/AccountService
            body: {AccountLockoutThreshold: 3, AccountLockoutDuration: 60}
            status: [200, 204]

      - cmd: redfish
        name: The account service reports the new threshold
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService, prop: AccountLockoutThreshold, op: eq, value: "3"}

      - cmd: redfish
        name: Failed login 1 is refused
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {user: tslockout, password: not-the-password}
          validate: request
          request: {method: GET, path: /redfish/v1/AccountService, status: 401}

      - cmd: redfish
        name: Failed login 2 is refused
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {user: tslockout, password: not-the-password}
          validate: request
          request: {method: GET, path: /redfish/v1/AccountService, status: 401}

      - cmd: redfish
        name: Failed login 3 is refused
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {user: tslockout, password: not-the-password}
          validate: request
          request: {method: GET, path: /redfish/v1/AccountService, status: 401}

      - cmd: redfish
        name: The locked account is refused with its right password
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {user: tslockout, password: Ts-L0ckout-26}
          validate: request
          request: {method: GET, path: /redfish/v1/AccountService, status: 401}

      - cmd: redfish
        name: The account logs in again after the lockout ends
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {user: tslockout, password: Ts-L0ckout-26}
          validate: inventory
          inventory:
            retry: {timeout: 3m, interval: 10s}
            rules:
              - {path: /redfish/v1/AccountService, prop: ServiceEnabled, op: exists}

      - cmd: redfish
        name: Lockout is turned off again
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: request
          request:
            method: PATCH
            path: /redfish/v1/AccountService
            body: {AccountLockoutThreshold: 0, AccountLockoutDuration: 0}
            status: [200, 204]

      - cmd: redfish
        name: The test account is deleted
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: request
          request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/tslockout, status: [200, 204]}
