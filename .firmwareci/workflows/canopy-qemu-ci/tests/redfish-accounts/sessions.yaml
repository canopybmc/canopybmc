name: Redfish sessions
description: >-
  Redfish authentication: the service root answers without login, protected
  resources refuse anonymous requests, a session opens with the right
  password, its token works, it belongs to its user, and it is gone after a
  delete, together with its token. Wrong passwords and unknown users get no
  session.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: Redfish sessions
    steps:
      # Waits on Redfish itself, see test rule 4 in the README.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: redfish
        name: The service root answers without login
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {mode: none}
          validate: request
          request: {method: GET, path: /redfish/v1, status: 200}

      - cmd: redfish
        name: The account service refuses anonymous requests
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {mode: none}
          validate: request
          request: {method: GET, path: /redfish/v1/AccountService, status: 401}

      - cmd: redfish
        name: The managers refuse anonymous requests
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {mode: none}
          validate: request
          request: {method: GET, path: /redfish/v1/Managers, status: 401}

      - cmd: redfish
        name: An administrator opens a session
        transport: *local
        parameters:
          <<: *admin
          auth: {mode: none}
          validate: request
          request:
            method: POST
            path: /redfish/v1/SessionService/Sessions
            body: {UserName: "[[attributes.BMCUser]]", Password: "[[attributes.BMCPassword]]"}
            status: 201
            rules:
              - {prop: "@odata.id", op: matches, value: "^/redfish/v1/SessionService/Sessions/", variable: SESSION}

      - cmd: redfish
        name: The session belongs to the administrator
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: request
          request:
            method: GET
            path: "{{ SESSION }}"
            status: 200
            rules:
              - {prop: UserName, op: eq, value: "[[attributes.BMCUser]]"}

      - cmd: redfish
        name: A session token reads the account service
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]", mode: session}
          validate: request
          request: {method: GET, path: /redfish/v1/AccountService, status: 200}

      - cmd: redfish
        name: The session is deleted
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: request
          request: {method: DELETE, path: "{{ SESSION }}", status: [200, 204]}

      - cmd: redfish
        name: The deleted session is gone
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: request
          request: {method: GET, path: "{{ SESSION }}", status: 404}

      # The redfish step does not store or send a session token, so this check
      # uses curl: it opens its own session, uses the token, deletes the
      # session with it and uses the token again.
      - cmd: shell
        name: A deleted session's token is refused
        transport: *local
        options: {timeout: 60s, on-failure: continue}
        parameters:
          command: |
            B="https://[[attributes.BMC]]:[[attributes.RedfishPort]]"
            H=$(curl -sk -m 20 -D - -o /dev/null -H 'Content-Type: application/json' \
              -d '{"UserName":"[[attributes.BMCUser]]","Password":"[[attributes.BMCPassword]]"}' \
              "$B/redfish/v1/SessionService/Sessions" | tr -d '\r')
            T=$(echo "$H" | awk 'tolower($1) == "x-auth-token:" {print $2}')
            L=$(echo "$H" | awk 'tolower($1) == "location:" {print $2}')
            get() { curl -sk -m 20 -o /dev/null -w '%{http_code}' -H "X-Auth-Token: $T" "$@"; }
            before=$(get "$B/redfish/v1/AccountService")
            delete=$(get -X DELETE "$B$L")
            after=$(get "$B/redfish/v1/AccountService")
            echo "before=$before delete=$delete after=$after"
          expect:
            - regex: '^before=200 delete=20[04] after=401$'

      - cmd: redfish
        name: A session with a wrong password is refused
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {mode: none}
          validate: request
          request:
            method: POST
            path: /redfish/v1/SessionService/Sessions
            body: {UserName: "[[attributes.BMCUser]]", Password: not-the-password}
            status: 401

      - cmd: redfish
        name: A session for an unknown user is refused
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {mode: none}
          validate: request
          request:
            method: POST
            path: /redfish/v1/SessionService/Sessions
            body: {UserName: tsnobody, Password: Ts-N0body-26}
            status: 401
