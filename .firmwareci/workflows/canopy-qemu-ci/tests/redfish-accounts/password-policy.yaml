name: Redfish password policy
description: >-
  The BMC enforces a password policy when an account is created: at least 8
  characters, more than one character class, and not containing the user
  name. A password that meets the policy is accepted.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: Redfish password policy
    steps:
      # Waits on Redfish itself, see test rule 4 in the README.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: redfish
        name: A leftover test account is removed
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/tspolicy, status: [200, 204, 404]}

      - cmd: redfish
        name: The minimum password length is at least 8
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService, prop: MinPasswordLength, op: ge, value: "8"}

      - cmd: redfish
        name: A password shorter than 8 characters is refused
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: tspolicy, Password: Sh0rt-1, RoleId: ReadOnly, Enabled: true}
            status: 400

      - cmd: redfish
        name: A password with one character class is refused
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: tspolicy, Password: alllowercaseonly, RoleId: ReadOnly, Enabled: true}
            status: 400

      - cmd: redfish
        name: A password that contains the user name is refused
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: tspolicy, Password: Tspolicy-2026, RoleId: ReadOnly, Enabled: true}
            status: 400

      - cmd: redfish
        name: A password that meets the policy is accepted
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: tspolicy, Password: Ts-V4lid-Pass26, RoleId: ReadOnly, Enabled: true}
            status: 201

      # Also removes an account that a refused password created by mistake.
      - cmd: redfish
        name: The test account is removed
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: request
          request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/tspolicy, status: [200, 204]}
