name: "User: Password Policy"
description: >-
  Verify password policy enforcement via pam_pwquality. Tests rejection
  of too-short passwords, single character class, username in password,
  and acceptance of a valid password. BMC-only, no host power required.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
    validate: request
  # Removes leftovers of an earlier run, validuser, and users that a refused
  # request created by mistake.
  cleanup: &cleanup
    - cmd: redfish
      name: Delete validuser if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/validuser, status: [200, 204, 404]}
    - cmd: redfish
      name: Delete weakuser1 if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/weakuser1, status: [200, 204, 404]}
    - cmd: redfish
      name: Delete weakuser2 if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/weakuser2, status: [200, 204, 404]}
    - cmd: redfish
      name: Delete usercheck if it exists
      transport: *local
      parameters:
        <<: *admin
        request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/usercheck, status: [200, 204, 404]}

stages:
  - name: Wait for BMC
    steps:
      # Waits on Redfish itself: the QEMU port forward accepts before the BMC listens.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

  - name: Remove Leftovers
    steps: *cleanup

  - name: Weak Password Rejection
    on-failure: continue
    steps:
      - cmd: redfish
        name: Reject password shorter than 8 chars (HTTP 400)
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: weakuser1, Password: Short1, RoleId: Administrator, Enabled: true}
            status: 400
      - cmd: redfish
        name: Reject single character class password (HTTP 400)
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: weakuser2, Password: alllowercase, RoleId: Administrator, Enabled: true}
            status: 400
      - cmd: redfish
        name: Reject password containing username (HTTP 400)
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: usercheck, Password: Usercheck99, RoleId: Administrator, Enabled: true}
            status: 400

  - name: Valid Password Acceptance
    steps:
      - cmd: redfish
        name: Accept valid password (HTTP 201)
        transport: *local
        parameters:
          <<: *admin
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: validuser, Password: V4lidPass9, RoleId: Administrator, Enabled: true}
            status: 201

  # FirmwareCI has no stage that runs after both a pass and a failure, so the
  # same steps run in a normal last stage and in a failure stage.
  - name: Cleanup
    on-failure: continue
    steps: *cleanup

  - name: Cleanup after a failure
    run-condition: failure
    on-failure: continue
    steps: *cleanup
