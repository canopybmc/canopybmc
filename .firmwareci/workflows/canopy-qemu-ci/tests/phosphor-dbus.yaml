name: "Services: D-Bus Infrastructure"
description: >-
  Validate D-Bus system bus accessibility, core phosphor service
  registration, object tree structure, and essential OpenBMC services.

on-failure: continue

defaults:
  transport: &bmc_ssh
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
      port: "[[attributes.SSHPort]]"

stages:
  - name: Wait for BMC
    steps:
      # The SSH transport does not retry a refused connection, and the QEMU
      # port forward accepts before the BMC listens. Once Redfish answers, SSH
      # is up too.
      - cmd: redfish
        name: Redfish service answers
        transport: {proto: local}
        parameters:
          host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
          auth: {user: "[[attributes.BMCUser]]", password: "[[attributes.BMCPassword]]"}
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}
      # is-system-running exits 1 when degraded; this only waits for the
      # services to start, the checks below test them.
      - cmd: shell
        name: systemd startup finished
        transport: *bmc_ssh
        options: {timeout: 10m}
        parameters:
          command: echo "$(systemctl is-system-running --wait)"
          expect:
            - regex: '^(running|degraded)$'

  - name: D-Bus System Bus
    steps:
      - cmd: shell
        name: D-Bus system bus is accessible
        transport: *bmc_ssh
        parameters:
          command: busctl status
          expect:
            - regex: "BusAddress=unix:path="
      - cmd: shell
        name: systemd1 registered
        transport: *bmc_ssh
        parameters:
          command: busctl list --no-pager
          expect:
            - regex: '^org\.freedesktop\.systemd1\s'
      - cmd: shell
        name: freedesktop.DBus registered
        transport: *bmc_ssh
        parameters:
          command: busctl list --no-pager
          expect:
            - regex: '^org\.freedesktop\.DBus\s'

  - name: Core Phosphor Services on D-Bus
    steps:
      - cmd: shell
        name: Inventory.Manager on D-Bus
        transport: *bmc_ssh
        parameters:
          command: busctl list --no-pager
          expect:
            - regex: '^xyz\.openbmc_project\.Inventory\.Manager\s'
      - cmd: shell
        name: Logging on D-Bus
        transport: *bmc_ssh
        parameters:
          command: busctl list --no-pager
          expect:
            - regex: '^xyz\.openbmc_project\.Logging\s'
      - cmd: shell
        name: Settings on D-Bus
        transport: *bmc_ssh
        parameters:
          command: busctl list --no-pager
          expect:
            - regex: '^xyz\.openbmc_project\.Settings\s'

  - name: Phosphor Service Status
    steps:
      - cmd: shell
        name: Inventory Manager active
        transport: *bmc_ssh
        parameters:
          command: systemctl is-active xyz.openbmc_project.Inventory.Manager
          expect:
            - regex: '^active$'
      - cmd: shell
        name: Logging active
        transport: *bmc_ssh
        parameters:
          command: systemctl is-active xyz.openbmc_project.Logging
          expect:
            - regex: '^active$'
      - cmd: shell
        name: Settings active
        transport: *bmc_ssh
        parameters:
          command: systemctl is-active xyz.openbmc_project.Settings
          expect:
            - regex: '^active$'
      - cmd: shell
        name: bmcweb active
        transport: *bmc_ssh
        parameters:
          command: systemctl is-active bmcweb
          expect:
            - regex: '^active$'
      - cmd: shell
        name: phosphor-ipmi-host active
        transport: *bmc_ssh
        parameters:
          command: systemctl is-active phosphor-ipmi-host
          expect:
            - regex: '^active$'

  - name: D-Bus Object Trees
    steps:
      - cmd: shell
        name: Inventory object tree exists
        transport: *bmc_ssh
        parameters:
          command: busctl tree xyz.openbmc_project.Inventory.Manager --no-pager
          expect:
            - regex: "/xyz/openbmc_project/inventory"
      - cmd: shell
        name: Logging.Create interface available
        transport: *bmc_ssh
        parameters:
          command: busctl introspect xyz.openbmc_project.Logging /xyz/openbmc_project/logging --no-pager
          expect:
            - regex: '^xyz\.openbmc_project\.Logging\.Create\s'
