name: "Sensor: Fan Control"
description: >-
  Verify PID fan control is running and producing reasonable PWM values once
  the host has finished POST. Covers phosphor-pid-control patches, fan sensor
  config, PID zones from entity-manager, and fan presence monitoring. Each PWM
  sensor in the DUT attribute Fans.Pwms must read 5 to 100 percent.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  bmc_ssh: &bmc_ssh
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  # busctl prints "d <value>"; the regex accepts 5 to 100.
  pwm_in_range: &pwm_in_range
    - regex: '^d (([5-9]|[1-9][0-9])(\.[0-9]+)?|100(\.0+)?)$'

stages:
  - name: Power On host
    steps:
      - cmd: redfish
        name: The host is powered on
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: "On"}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "On"}
            retry: {timeout: 5m, interval: 5s}

      # Host thermal sensors feed the PID zones; the SMBIOS transfer marks POST complete.
      - cmd: shell
        name: Wait for SMBIOS transfer (host POST complete)
        transport: *bmc_ssh
        options:
          timeout: 15m
        parameters:
          command: >-
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full');
            while [ ! -f /var/lib/smbios/smbios2 ] ||
                  [ $(stat -c %s /var/lib/smbios/smbios2 2>/dev/null || echo 0) -le 1000 ];
            do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full');
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF";
                systemctl restart xyz.openbmc_project.GxpChif.service;
                full=$now;
              fi;
              sleep 5;
            done;
            echo "SMBIOS ready: $(stat -c %s /var/lib/smbios/smbios2) bytes"
          expect:
            - regex: "SMBIOS ready"

  - name: Fan Control Services
    steps:
      - cmd: cmd
        name: phosphor-pid-control active
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: systemctl
          args: ["is-active", "phosphor-pid-control.service"]
      - cmd: cmd
        name: Fan presence service active
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: systemctl
          args: ["is-active", "phosphor-fan-presence-tach@0.service"]

  # One step per item of Fans.Pwms: a list attribute cannot go into a command string.
  - name: Fan PWM Values in Range
    steps:
      - cmd: cmd
        name: "[[attributes.Fans.Pwms.0]] is in 5-100% range"
        transport: *bmc_ssh
        options:
          timeout: 10s
          on-failure: continue
        parameters:
          executable: busctl
          args: [get-property, xyz.openbmc_project.FanSensor, "/xyz/openbmc_project/sensors/fan_pwm/[[attributes.Fans.Pwms.0]]", xyz.openbmc_project.Sensor.Value, Value]
          expect: *pwm_in_range
      - cmd: cmd
        name: "[[attributes.Fans.Pwms.1]] is in 5-100% range"
        transport: *bmc_ssh
        options:
          timeout: 10s
          on-failure: continue
        parameters:
          executable: busctl
          args: [get-property, xyz.openbmc_project.FanSensor, "/xyz/openbmc_project/sensors/fan_pwm/[[attributes.Fans.Pwms.1]]", xyz.openbmc_project.Sensor.Value, Value]
          expect: *pwm_in_range
      - cmd: cmd
        name: "[[attributes.Fans.Pwms.2]] is in 5-100% range"
        transport: *bmc_ssh
        options:
          timeout: 10s
          on-failure: continue
        parameters:
          executable: busctl
          args: [get-property, xyz.openbmc_project.FanSensor, "/xyz/openbmc_project/sensors/fan_pwm/[[attributes.Fans.Pwms.2]]", xyz.openbmc_project.Sensor.Value, Value]
          expect: *pwm_in_range
      - cmd: cmd
        name: "[[attributes.Fans.Pwms.3]] is in 5-100% range"
        transport: *bmc_ssh
        options:
          timeout: 10s
          on-failure: continue
        parameters:
          executable: busctl
          args: [get-property, xyz.openbmc_project.FanSensor, "/xyz/openbmc_project/sensors/fan_pwm/[[attributes.Fans.Pwms.3]]", xyz.openbmc_project.Sensor.Value, Value]
          expect: *pwm_in_range
      - cmd: cmd
        name: "[[attributes.Fans.Pwms.4]] is in 5-100% range"
        transport: *bmc_ssh
        options:
          timeout: 10s
          on-failure: continue
        parameters:
          executable: busctl
          args: [get-property, xyz.openbmc_project.FanSensor, "/xyz/openbmc_project/sensors/fan_pwm/[[attributes.Fans.Pwms.4]]", xyz.openbmc_project.Sensor.Value, Value]
          expect: *pwm_in_range

  - name: PID Zone Configuration
    steps:
      - cmd: cmd
        name: PID zone exists on D-Bus
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: busctl
          args: [tree, xyz.openbmc_project.State.FanCtrl, --no-pager]
          expect:
            - regex: "zone"
