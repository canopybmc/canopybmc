name: "Sensor: Fan Control"
description: >-
  Verify PID fan control is running and producing reasonable PWM values.
  Covers phosphor-pid-control patches, fan sensor config and PID zones from
  entity-manager, then fan inventory from fansensor and Redfish
  ThermalSubsystem/Fans for the same fans 3-7 as the PWM check.

defaults:
  transport: &bmc_ssh
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      user: "root"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: Power On host
    steps:
      - cmd: cmd
        name: Power on host via Redfish
        transport:
          proto: local
        parameters:
          executable: sh
          args:
            - "-c"
            - "HTTP=$(curl -sk -u root:[[attributes.BMCPassword]] -X POST -H 'Content-Type: application/json' -d '{\"ResetType\":\"On\"}' https://[[attributes.BMC]]/redfish/v1/Systems/system/Actions/ComputerSystem.Reset -o /dev/null -w '%{http_code}'); echo \"Power On HTTP=$HTTP\"; test \"$HTTP\" = \"200\" || test \"$HTTP\" = \"204\""
      - cmd: cmd
        name: Wait 120s for host and thermal sensors
        transport:
          proto: local
        options:
          timeout: 3m
        parameters:
          executable: sleep
          args: ["120"]

  - name: Fan Control Services
    steps:
      - cmd: cmd
        name: phosphor-pid-control active
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: systemctl
          args: ["is-active", "phosphor-pid-control.service"]

  - name: Fan PWM Values in Range
    steps:
      - cmd: cmd
        name: All PWMs in 5-100% range
        transport: *bmc_ssh
        options:
          timeout: 10s
          on-failure: continue
        parameters:
          executable: sh
          args:
            - "-c"
            - "OK=true; for P in Pwm_3 Pwm_4 Pwm_5 Pwm_6 Pwm_7; do VAL=$(busctl get-property xyz.openbmc_project.FanSensor /xyz/openbmc_project/sensors/fan_pwm/$P xyz.openbmc_project.Sensor.Value Value 2>/dev/null | awk '{print $2}'); echo \"$P=$VAL%\"; if [ -z \"$VAL\" ]; then echo \"FAIL: $P not found\"; OK=false; elif ! echo \"$VAL\" | awk '{v=$1+0; if (v>=5 && v<=100) exit 0; else exit 1}'; then echo \"FAIL: $P out of range\"; OK=false; fi; done; $OK"

  - name: PID Zone Configuration
    steps:
      - cmd: cmd
        name: PID zone exists on D-Bus
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: busctl
          args: [tree, xyz.openbmc_project.State.FanCtrl, --no-pager]
          expect:
            - regex: "zone"

  - name: Fan Inventory
    steps:
      - cmd: cmd
        name: Fans 3-7 publish Inventory.Item.Fan
        transport: *bmc_ssh
        options:
          timeout: 10s
        parameters:
          executable: sh
          args:
            - "-c"
            - "OK=true; for N in 3 4 5 6 7; do if busctl introspect xyz.openbmc_project.FanSensor /xyz/openbmc_project/inventory/Fan_$N 2>/dev/null | grep -q '^xyz.openbmc_project.Inventory.Item.Fan '; then echo \"Fan_$N has Item.Fan\"; else echo \"FAIL: Fan_$N has no Item.Fan\"; OK=false; fi; done; $OK"
      - cmd: cmd
        name: Fans 3-7 present
        transport: *bmc_ssh
        options:
          timeout: 10s
        parameters:
          executable: sh
          args:
            - "-c"
            - "OK=true; for N in 3 4 5 6 7; do P=$(busctl get-property xyz.openbmc_project.FanSensor /xyz/openbmc_project/inventory/Fan_$N xyz.openbmc_project.Inventory.Item Present 2>/dev/null); echo \"Fan_$N Present=$P\"; [ \"$P\" = \"b true\" ] || OK=false; done; $OK"
      - cmd: cmd
        name: Fans 3-7 functional
        transport: *bmc_ssh
        options:
          timeout: 10s
        parameters:
          executable: sh
          args:
            - "-c"
            - "OK=true; for N in 3 4 5 6 7; do F=$(busctl get-property xyz.openbmc_project.FanSensor /xyz/openbmc_project/inventory/Fan_$N xyz.openbmc_project.State.Decorator.OperationalStatus Functional 2>/dev/null); echo \"Fan_$N Functional=$F\"; [ \"$F\" = \"b true\" ] || OK=false; done; $OK"
      - cmd: cmd
        name: Redfish lists 7 fans
        transport:
          proto: local
        options:
          timeout: 30s
        parameters:
          executable: curl
          args: [-sk, -u, "root:[[attributes.BMCPassword]]", "https://[[attributes.BMC]]/redfish/v1/Chassis/chassis/ThermalSubsystem/Fans"]
          expect:
            - regex: '"Members@odata.count": *7\b'
      - cmd: cmd
        name: Redfish fans 3-7 Enabled and OK
        transport:
          proto: local
        options:
          timeout: 30s
        parameters:
          executable: sh
          args:
            - "-c"
            - "OK=true; for N in 3 4 5 6 7; do R=$(curl -sk -u root:[[attributes.BMCPassword]] https://[[attributes.BMC]]/redfish/v1/Chassis/chassis/ThermalSubsystem/Fans/Fan_$N | tr -d ' \\n'); case \"$R\" in *'\"State\":\"Enabled\"'*) ;; *) echo \"FAIL: Fan_$N not Enabled\"; OK=false; continue;; esac; case \"$R\" in *'\"Health\":\"OK\"'*) echo \"Fan_$N Enabled OK\";; *) echo \"FAIL: Fan_$N Health not OK\"; OK=false;; esac; done; $OK"
