name: "Inventory: D-Bus Objects"
description: >-
  Verify SMBIOS-derived inventory objects are present on D-Bus after host POST.
  Covers the smbios-mdr service populating TPM, PCIe slots, BIOS, DIMM, and
  CPU objects under xyz.openbmc_project.Smbios.MDR_V2. Powers the host on and
  waits for the SMBIOS transfer first.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  bmc_ssh: &bmc_ssh
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: Power On host
    steps:
      - cmd: redfish
        name: The host is powered on
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: "On"}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "On"}
            retry: {timeout: 5m, interval: 5s}
      - cmd: shell
        name: Wait for SMBIOS transfer
        transport: *bmc_ssh
        options:
          timeout: 15m
        parameters:
          command: >-
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full');
            while [ ! -f /var/lib/smbios/smbios2 ] ||
                  [ $(stat -c %s /var/lib/smbios/smbios2 2>/dev/null || echo 0) -le 1000 ];
            do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full');
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF";
                systemctl restart xyz.openbmc_project.GxpChif.service;
                full=$now;
              fi;
              sleep 5;
            done;
            echo "SMBIOS ready: $(stat -c %s /var/lib/smbios/smbios2) bytes"
          expect:
            - regex: "SMBIOS ready"

  - name: SMBIOS D-Bus Objects
    steps:
      - cmd: cmd
        name: TPM object on Smbios.MDR_V2
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: busctl
          args: [tree, xyz.openbmc_project.Smbios.MDR_V2, --no-pager]
          expect:
            - regex: "tpm0"
      - cmd: shell
        name: PCIe slot objects on Smbios.MDR_V2 at the board minimum
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          command: >-
            n=$(busctl tree xyz.openbmc_project.Smbios.MDR_V2 --no-pager | grep -c pcieslot);
            echo "PCIe slots: $n, minimum [[attributes.Smbios.MinPcieSlots]]";
            [ "$n" -ge "[[attributes.Smbios.MinPcieSlots]]" ]
      # "/bios": a bare "bios" also matches the service path /xyz/openbmc_project/Smbios.
      - cmd: cmd
        name: BIOS object on Smbios.MDR_V2
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: busctl
          args: [tree, xyz.openbmc_project.Smbios.MDR_V2, --no-pager]
          expect:
            - regex: "/bios"
      - cmd: cmd
        name: DIMM objects on Smbios.MDR_V2
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: busctl
          args: [tree, xyz.openbmc_project.Smbios.MDR_V2, --no-pager]
          expect:
            - regex: "dimm"
      - cmd: cmd
        name: CPU objects on Smbios.MDR_V2
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: busctl
          args: [tree, xyz.openbmc_project.Smbios.MDR_V2, --no-pager]
          expect:
            - regex: "cpu"
