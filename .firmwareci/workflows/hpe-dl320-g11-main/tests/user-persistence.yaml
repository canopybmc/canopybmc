name: "User: Persistence Across Reboot"
description: >-
  Verify user accounts persist across a BMC power cycle. Creates an Operator
  user over Redfish, verifies it and its login, power cycles the DUT via
  dutctl, then verifies the user still exists and can log in. After the
  reboot the user's role changes to ReadOnly and the user is deleted. A last
  stage deletes the user again if any earlier stage failed.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  account_rules: &account_rules
    - {path: /redfish/v1/AccountService/Accounts/persistuser, prop: UserName, op: eq, value: persistuser}
    - {path: /redfish/v1/AccountService/Accounts/persistuser, prop: RoleId, op: eq, value: Operator}
    - {path: /redfish/v1/AccountService/Accounts/persistuser, prop: Enabled, op: eq, value: "true"}
  delete_persistuser: &delete_persistuser
    cmd: redfish
    name: Remove persistuser if it exists
    transport: *local
    parameters:
      <<: *admin
      validate: request
      request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/persistuser, status: [200, 204, 404]}

stages:
  - name: Create User Before Reboot
    steps:
      - *delete_persistuser
      - cmd: redfish
        name: Create persistuser with Operator role
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: /redfish/v1/AccountService/Accounts
            body: {UserName: persistuser, Password: P3rsist77, RoleId: Operator, Enabled: true}
            status: 201

  - name: Verify Before Reboot
    steps:
      - cmd: redfish
        name: persistuser exists as an enabled Operator
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            rules: *account_rules
      - cmd: redfish
        name: persistuser can login before reboot
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {user: persistuser, password: P3rsist77}
          validate: request
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 200}

  - name: BMC Power Cycle
    steps:
      - cmd: dutctl
        name: Power off DUT
        parameters:
          agent: "[[attributes.Agent]]"
          device: "[[attributes.Device]]"
          command: power
          args: ["off"]
      # Off time so that the BMC really loses power; there is no signal to wait for.
      - cmd: sleep
        name: Wait for BMC to power down
        parameters:
          duration: 10s
      - cmd: dutctl
        name: Power on DUT
        parameters:
          agent: "[[attributes.Agent]]"
          device: "[[attributes.Device]]"
          command: power
          args: ["on"]
      - cmd: dutctl
        name: Wait for boot banner on serial
        options:
          timeout: 10m
        parameters:
          agent: "[[attributes.Agent]]"
          device: "[[attributes.Device]]"
          command: serial
          args: ["expect", "Phosphor OpenBMC"]
      - cmd: redfish
        name: Redfish answers after reboot
        transport: *local
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

  - name: Verify After Reboot
    steps:
      # The retry covers a user manager that starts after bmcweb.
      - cmd: redfish
        name: persistuser still exists as an enabled Operator
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            retry: {timeout: 2m, interval: 5s}
            rules: *account_rules
      - cmd: redfish
        name: persistuser can login after reboot
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          auth: {user: persistuser, password: P3rsist77}
          validate: request
          request: {method: GET, path: "[[attributes.RedfishSystem]]", status: 200}

  - name: Modify and Delete After Reboot
    steps:
      - cmd: redfish
        name: Change persistuser role to ReadOnly after reboot
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: PATCH
            path: /redfish/v1/AccountService/Accounts/persistuser
            body: {RoleId: ReadOnly}
            status: [200, 204]
      - cmd: redfish
        name: Verify role changed to ReadOnly
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: inventory
          inventory:
            rules:
              - {path: /redfish/v1/AccountService/Accounts/persistuser, prop: RoleId, op: eq, value: ReadOnly}
      - cmd: redfish
        name: Delete persistuser
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request: {method: DELETE, path: /redfish/v1/AccountService/Accounts/persistuser, status: 200}
      - cmd: redfish
        name: Verify persistuser is deleted
        transport: *local
        options:
          on-failure: continue
        parameters:
          <<: *admin
          validate: request
          request: {method: GET, path: /redfish/v1/AccountService/Accounts/persistuser, status: 404}

  # FirmwareCI has no run-condition "always"; on success the stage above deleted the user.
  - name: Cleanup After Failure
    run-condition: failure
    steps:
      - *delete_persistuser
