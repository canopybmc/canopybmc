name: "Host Firmware: Update on reset"
description: >-
  Trigger the host firmware (aka BIOS) update via Redfish with option "OnReset",
  wait for a short while, applying the Update through a reset and verify it is
  booting the new one.

  For HPE some magic firmware preparation is needed beforehand to get a correct
  PLDM package.

  If flashing takes to long the Redfish task is running in a timeout and therefore
  gets cancelled. The flash operation is however uneffected by this, so we don't
  error out. "Cancelled" = timeout, "Exception" = error in the update process.
  Possible errors are captured in the following step through systemd-journal.

defaults:
  transport: &bmc_ssh
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      user: root
      password: "[[attributes.BMCPassword]]"

variables:
  UpdateEndpointPrefix: UEFIPrimary
  BiosVersionBefore: null
  BiosVersionUpdate: null
  UpdateTarget: null
  UpdateTriggerOutput: null

stages:
  - name: Host on, OS Booting
    steps:
      - cmd: shell
        name: Extract BiosVersionBefore from golden image
        transport:
          proto: local
        parameters:
          shell: "/bin/bash"
          command: |
            strings [[storage.dl320g11_bios_update]]/[[storage.dl320g11_bios_update.golden_image]] \
              | grep -Po "(?<=^U63 v)[0-9]\.[0-9]+$" | tail -1
          expect:
            - regex: '[0-9]\.[0-9]+'
          variable: BiosVersionBefore

      - cmd: shell
        name: Extract BiosVersionUpdate from PLDM package
        transport:
          proto: local
        parameters:
          shell: "/bin/bash"
          command: |
            strings [[storage.dl320g11_bios_update]]/[[storage.dl320g11_bios_update.pldm]] \
              | grep -Po "(?<=^U63 v)[0-9]\.[0-9]+$"
          expect:
            - regex: '[0-9]\.[0-9]+'
          variable: BiosVersionUpdate

# TODO: check that the update version is > before

      - cmd: shell
        name: Power on host
        transport: &local
          proto: local
        parameters:
          command: >-
            curl -sk -u root:[[attributes.BMCPassword]]
            -X POST -H 'Content-Type: application/json'
            -d '{"ResetType":"On"}'
            -o /dev/null -w '%{http_code}'
            https://[[attributes.BMC]]/redfish/v1/Systems/system/Actions/ComputerSystem.Reset
          expect:
            - regex: "^(200|204)$"

      - cmd: shell
        name: Host system DC gets powered on (systemd-journal)
        options:
          timeout: 20s
        transport: *bmc_ssh
        parameters:
          command: |
            journalctl -n all -t power-control -f \
              | awk '{print} /Host system DC power is on/{exit}'

      - cmd: shell
        name: Wait for SMBIOS transfer (host POST complete)
        transport: *bmc_ssh
        options:
          timeout: 5m
        parameters:
          command: |
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full');
            while [ ! -f /var/lib/smbios/smbios2 ] ||
                  [ $(stat -c %s /var/lib/smbios/smbios2 2>/dev/null || echo 0) -le 1000 ];
            do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full');
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF";
                systemctl restart xyz.openbmc_project.GxpChif.service;
                full=$now;
              fi;
              sleep 5;
            done; echo "SMBIOS ready: $(stat -c %s /var/lib/smbios/smbios2) bytes"
          expect:
            - regex: "SMBIOS ready"

      - cmd: ping
        name: Wait for host OS
        options:
          timeout: 2m
        parameters:
          host: "[[attributes.Host]]"

      - cmd: redfish
        name: Current BiosVersion
        options:
          timeout: 10s
        transport: *local
        parameters:
          host: "[[attributes.BMC]]"
          auth:
            user: root
            password: "[[attributes.BMCPassword]]"
          validate: inventory
          inventory:
            rules:
              - path: /redfish/v1/Systems/system
                prop: BiosVersion
                op: matches
                value: "{{ BiosVersionBefore }}"

  - name: "Firmware update to newer version"
    steps:
      - cmd: shell
        name: Get update endpoint
        options:
          timeout: 10s
        transport: *local
        parameters:
          command: |
            curl -sk --user root:[[attributes.BMCPassword]] \
              https://[[attributes.BMC]]/redfish/v1/UpdateService/FirmwareInventory \
              | grep -Eo {{ UpdateEndpointPrefix }}_[0-9]+
          expect:
            - regex: '{{ UpdateEndpointPrefix }}_\d+'
          variable: UpdateTarget

      - cmd: redfish
        name: Is updateable?
        options:
          timeout: 10s
        transport: *local
        parameters:
          host: "[[attributes.BMC]]"
          auth:
            user: root
            password: "[[attributes.BMCPassword]]"
          validate: inventory
          inventory:
            rules:
              - path: /redfish/v1/UpdateService/FirmwareInventory/{{ UpdateTarget }}
                prop: Updateable
                op: eq
                value: "true"

      - cmd: shell
        name: Capture update time
        options:
          timeout: 10s
          on-error: continue
        transport: *bmc_ssh
        parameters:
          command: date +%H:%M:%S > /tmp/UpdateStart

      - cmd: shell
        name: Trigger update
        options:
          timeout: 1m
        transport: *local
        parameters:
          command: >-
            curl -sk --user root:[[attributes.BMCPassword]]
            -X POST -H Content-Type:multipart/form-data
            -F 'UpdateParameters={"Targets":["/redfish/v1/UpdateService/FirmwareInventory/{{ UpdateTarget }}"],"@Redfish.OperationApplyTime":"OnReset"};type=application/json'
            -F 'UpdateFile=@[[storage.dl320g11_bios_update]]/[[storage.dl320g11_bios_update.pldm]];type=application/octet-stream'
            https://[[attributes.BMC]]/redfish/v1/UpdateService/update-multipart
          expect:
            - regex: TaskStarted
          variable: UpdateTriggerOutput

      - cmd: shell
        name: Wait for update finish (Redfish)
        # fails when update is too slow
        transport: *local
        options:
          timeout: 3m
          on-error: continue
        parameters:
          command: |
            Task=$(echo {{ UpdateTriggerOutput }} | grep -Eo "/redfish/v1/TaskService/Tasks/[0-9]+" );
            TaskState="Running";
            while [ "$TaskState" = "Running" ]; do
              sleep 2;
              TaskState=$(curl -sk --user root:[[attributes.BMCPassword]] https://[[attributes.BMC]]${Task} | grep TaskState | sed -E 's/.*"(.*)",$/\1/');
            done;
            echo "$TaskState"
          expect:
            - regex: Completed

      - cmd: shell
        name: Wait for update finish (systemd-journal)
        options:
          timeout: 1m
          on-error: continue
        transport: *bmc_ssh
        parameters:
          command: >
            journalctl -n all -t phosphor-spi-flash-software-update -t power-control -f \
              | awk "{print} /VerificationFailed|ActivateFailed|UpdateNotApplicable|ResetRequired/{exit}"
          expect:
            - regex: UpdateSuccessful
            - regex: ResetRequired

      - cmd: shell
        name: Check if update didn't triggered a reboot
        options:
          timeout: 10s
          on-error: continue
        transport: *bmc_ssh
        parameters:
          command: journalctl -S $(cat /tmp/UpdateStart) -t power-control
          expect:
            - regex: No entries

      - cmd: shell
        name: Check for updated inventory
        options:
          timeout: 10s
          on-error: continue
        transport: *local
        parameters:
          command: |
            NEWTARGET=$(curl -sk --user root:[[attributes.BMCPassword]] \
            https://[[attributes.BMC]]/redfish/v1/UpdateService/FirmwareInventory \
            | grep -Eo "{{ UpdateEndpointPrefix }}_[0-9]+")
            if [ "{{ UpdateTarget }}" != "$NEWTARGET" ]; then
              echo "$NEWTARGET";
            fi;
          expect:
            - regex: '{{ UpdateEndpointPrefix }}_\d+'

      - cmd: redfish
        name: Approve yet unchanged BiosVersion
        options:
          timeout: 10s
        transport: *local
        parameters:
          host: "[[attributes.BMC]]"
          auth:
            user: root
            password: "[[attributes.BMCPassword]]"
          validate: inventory
          inventory:
            rules:
              - path: /redfish/v1/Systems/system
                prop: BiosVersion
                op: eq
                value: '{{ BiosVersionBefore }}'

      - cmd: cmd
        name: Wait a bit
        transport: *local
        options:
          timeout: 1m
        parameters:
          executable: sleep
          args: ["30"]

      - cmd: shell
        name: Reboot host
        transport: *local
        parameters:
          command: >-
            curl -sk -u root:[[attributes.BMCPassword]]
            -X POST -H 'Content-Type: application/json'
            -d '{"ResetType":"GracefulRestart"}'
            -o /dev/null -w '%{http_code}'
            https://[[attributes.BMC]]/redfish/v1/Systems/system/Actions/ComputerSystem.Reset
          expect:
            - regex: "^(200|204)$"

      - cmd: shell
        name: Host system gets rebootet (systemd-journal)
        options:
          timeout: 2m
          on-error: continue
        transport: *bmc_ssh
        parameters:
          command: |
            journalctl -S -30s -t power-control -f \
              | awk '{print} /Host system DC power is on/{exit}'

      - cmd: ping
        name: Wait for host OS
        options:
          timeout: 10m
          on-error: continue
        parameters:
          host: "[[attributes.Host]]"

      - cmd: redfish
        name: Approve updated BiosVersion
        options:
          timeout: 10s
        transport: *local
        parameters:
          host: "[[attributes.BMC]]"
          auth:
            user: root
            password: "[[attributes.BMCPassword]]"
          validate: inventory
          inventory:
            rules:
              - path: /redfish/v1/Systems/system
                prop: BiosVersion
                op: eq
                value: '{{ BiosVersionUpdate }}'
