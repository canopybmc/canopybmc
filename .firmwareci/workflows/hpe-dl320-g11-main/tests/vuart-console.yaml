name: "Console: VUART Userspace"
description: >-
  Verify the OpenBMC host console stack: obmc-console-server on ttyVUART0,
  the udev symlink to the host tty, the obmc-console-ssh port, and log file
  capture. A last stage boots the host and checks that its POST output
  reaches the console log. This is an OpenBMC userspace test: it validates
  the phosphor console infrastructure on top of the GXP VUART kernel driver.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  bmc_ssh: &bmc_ssh
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: Console Server
    steps:
      - cmd: cmd
        name: obmc-console-server active on ttyVUART0
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: systemctl
          args: ["is-active", "obmc-console@ttyVUART0.service"]
      - cmd: shell
        name: Server process running with correct config
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          command: "PID=$(pidof obmc-console-server) && tr '\\0' ' ' < /proc/$PID/cmdline"
          expect:
            - regex: "ttyVUART0"
      - cmd: shell
        name: Server has the host tty open
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          command: "PID=$(pidof obmc-console-server) && ls -l /proc/$PID/fd/"
          expect:
            - regex: "-> /dev/[[attributes.Console.HostTty]]$"

  - name: Console Configuration
    steps:
      - cmd: cmd
        name: Server config exists with logsize
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: cat
          args: ["/etc/obmc-console/server.ttyVUART0.conf"]
          expect:
            - regex: "^\\s*logsize"
      - cmd: shell
        name: No self-referencing local-tty in config
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          command: "awk '/local-tty/ {n++} END {print n+0}' /etc/obmc-console/server.ttyVUART0.conf"
          expect:
            - regex: "^0$"

  - name: Udev Symlink
    steps:
      - cmd: cmd
        name: ttyVUART0 symlink created by udev rule
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: readlink
          args: ["/dev/ttyVUART0"]
          expect:
            - regex: "(^|/)[[attributes.Console.HostTty]]$"
      - cmd: cmd
        name: Console udev rule installed
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: test
          args: ["-f", "/usr/lib/udev/rules.d/[[attributes.Console.UdevRule]]"]

  - name: Console Unix Socket
    steps:
      - cmd: cmd
        name: Abstract socket obmc-console.default exists
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: cat
          args: ["/proc/net/unix"]
          expect:
            - regex: "@obmc-console\\.default"

  - name: Console SSH Service
    steps:
      - cmd: cmd
        name: obmc-console-ssh socket active
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: systemctl
          args: ["is-active", "obmc-console-ssh.socket"]
      - cmd: cmd
        name: Dropbear config exists
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: test
          args: ["-f", "/etc/obmc-console/dropbear.env"]
      - cmd: ping
        name: Console SSH port accepts connections
        options:
          timeout: 10s
          on-failure: continue
        parameters:
          host: "[[attributes.BMC]]"
          port: "[[attributes.Console.SshPort]]"

  - name: Console Log File
    steps:
      - cmd: cmd
        name: Log file exists at /var/log/obmc-console.log
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: test
          args: ["-f", "/var/log/obmc-console.log"]
      - cmd: shell
        name: Log file open by console server
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          command: "PID=$(pidof obmc-console-server) && ls -l /proc/$PID/fd/"
          expect:
            - regex: "/obmc-console\\.log$"

  - name: obmc-console-client
    steps:
      - cmd: cmd
        name: obmc-console-client binary installed
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: test
          args: ["-x", "/usr/bin/obmc-console-client"]

  - name: Console Data Flow
    steps:
      - cmd: redfish
        name: The host is powered off
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: ForceOff}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "Off"}
            retry: {timeout: 2m, interval: 5s}
      - cmd: shell
        name: Record log file size before host boot
        transport: *bmc_ssh
        options:
          timeout: 5s
        parameters:
          command: "wc -c < /var/log/obmc-console.log"
          expect:
            - regex: "^ *[0-9]+$"
          variable: LOG_BEFORE
      - cmd: redfish
        name: The host is powered on
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: "On"}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "On"}
            retry: {timeout: 5m, interval: 5s}
      - cmd: shell
        name: Wait for SMBIOS transfer (host POST complete)
        transport: *bmc_ssh
        options:
          timeout: 15m
        parameters:
          command: >-
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full');
            while [ ! -f /var/lib/smbios/smbios2 ] ||
                  [ $(stat -c %s /var/lib/smbios/smbios2 2>/dev/null || echo 0) -le 1000 ];
            do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full');
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF";
                systemctl restart xyz.openbmc_project.GxpChif.service;
                full=$now;
              fi;
              sleep 5;
            done;
            echo "SMBIOS ready: $(stat -c %s /var/lib/smbios/smbios2) bytes"
          expect:
            - regex: "SMBIOS ready"
      - cmd: shell
        name: Console log grew by more than 100 bytes during host boot
        transport: *bmc_ssh
        options:
          timeout: 10s
          on-failure: continue
        parameters:
          command: >-
            d=$(( $(wc -c < /var/log/obmc-console.log) - {{ LOG_BEFORE }} ));
            echo "console log grew by $d bytes"; [ "$d" -gt 100 ]
      - cmd: shell
        name: Console log contains host POST text
        transport: *bmc_ssh
        options:
          timeout: 10s
          on-failure: continue
        parameters:
          command: "tail -c +$(( {{ LOG_BEFORE }} + 1 )) /var/log/obmc-console.log | grep -oiE 'Initialization|CHIF|Memory|BMC' | sort -u"
          expect:
            - regex: "(?i)initialization|chif|memory|bmc"
