name: "Console: VUART Kernel"
description: >-
  Verify the GXP Virtual UART kernel driver (8250_gxp_vuart) is loaded and
  functional. Checks device node, driver binding, sysfs attributes (LPC
  address, SIRQ, enable), and that the VUART receives host POST data when
  the host boots. This is a kernel-level test: it stops obmc-console and
  reads directly from /dev/ttyS3. The test starts obmc-console again at the
  end, and a last stage does so after a failure.

defaults:
  local: &local
    proto: local
  admin: &admin
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  bmc_ssh: &bmc_ssh
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  restart_console: &restart_console
    cmd: shell
    name: Stop raw capture and restart obmc-console-server
    transport: *bmc_ssh
    options:
      timeout: 10s
    parameters:
      command: "kill $(pidof dd) 2>/dev/null; rm -f /tmp/vuart_test.bin; systemctl start obmc-console@ttyVUART0.service"

stages:
  - name: Device Node
    steps:
      - cmd: cmd
        name: ttyVUART0 symlink exists
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: readlink
          args: [/dev/ttyVUART0]
          expect:
            - regex: "(^|/)ttyS3$"
      - cmd: cmd
        name: ttyS3 character device exists
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: test
          args: ["-c", "/dev/ttyS3"]

  - name: Driver Binding
    steps:
      - cmd: cmd
        name: VUART bound to 80fd0200.serial
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: test
          args: ["-d", "/sys/devices/platform/ahb@80000000/80fd0200.serial"]
      - cmd: cmd
        name: Compatible is hpe,gxp-vuart
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: cat
          args: ["/sys/firmware/devicetree/base/ahb@80000000/serial@80fd0200/compatible"]
          expect:
            - regex: "hpe,gxp-vuart"
      - cmd: cmd
        name: Detected as 16550A in dmesg
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: dmesg
          args: []
          expect:
            - regex: "80fd0200\\.serial.*16550A"

  - name: Sysfs Attributes
    steps:
      - cmd: cmd
        name: VUART is enabled
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: cat
          args: ["/sys/devices/platform/ahb@80000000/80fd0200.serial/vuart_enable"]
          expect:
            - regex: "^1$"
      - cmd: cmd
        name: LPC address is COM1 or COM2 (0x3f8 or 0x2f8)
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: cat
          args: ["/sys/devices/platform/ahb@80000000/80fd0200.serial/lpc_address"]
          expect:
            - regex: "^0x[23]f8$"
      - cmd: cmd
        name: SIRQ is 3 or 4 (COM IRQ)
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          executable: cat
          args: ["/sys/devices/platform/ahb@80000000/80fd0200.serial/sirq"]
          expect:
            - regex: "^[34]$"

  - name: Host Data Reception
    steps:
      - cmd: redfish
        name: The host is powered off
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: ForceOff}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "Off"}
            retry: {timeout: 2m, interval: 5s}
      - cmd: shell
        name: Record baseline interrupt count
        transport: *bmc_ssh
        options:
          timeout: 5s
        parameters:
          command: "awk '/ttyS3/ {print $2}' /proc/interrupts"
          expect:
            - regex: "^[0-9]+$"
          variable: IRQ_BEFORE
      # dd keeps ttyS3 open until the restart step kills it, so its IRQ line stays in /proc/interrupts.
      - cmd: shell
        name: Stop obmc-console and start raw capture
        transport: *bmc_ssh
        options:
          timeout: 10s
        parameters:
          command: "systemctl stop obmc-console@ttyVUART0.service; rm -f /tmp/vuart_test.bin; nohup sh -c 'dd if=/dev/ttyS3 of=/tmp/vuart_test.bin bs=1 count=1048576 2>/dev/null' </dev/null >/dev/null 2>&1 &"
      - cmd: redfish
        name: The host is powered on
        transport: *local
        parameters:
          <<: *admin
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: "On"}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "On"}
            retry: {timeout: 5m, interval: 5s}
      - cmd: shell
        name: Wait for SMBIOS transfer (host POST complete)
        transport: *bmc_ssh
        options:
          timeout: 15m
        parameters:
          command: >-
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full');
            while [ ! -f /var/lib/smbios/smbios2 ] ||
                  [ $(stat -c %s /var/lib/smbios/smbios2 2>/dev/null || echo 0) -le 1000 ];
            do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full');
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF";
                systemctl restart xyz.openbmc_project.GxpChif.service;
                full=$now;
              fi;
              sleep 5;
            done;
            echo "SMBIOS ready: $(stat -c %s /var/lib/smbios/smbios2) bytes"
          expect:
            - regex: "SMBIOS ready"
      - cmd: shell
        name: VUART received more than 100 bytes from host
        transport: *bmc_ssh
        options:
          timeout: 10s
          on-failure: continue
        parameters:
          command: "n=$(wc -c < /tmp/vuart_test.bin); echo \"captured_bytes=$n\"; [ \"$n\" -gt 100 ]"
      - cmd: shell
        name: Interrupt count rose by more than 10 during host boot
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          command: "n=$(awk '/ttyS3/ {print $2}' /proc/interrupts); echo \"irq_before={{ IRQ_BEFORE }} irq_after=$n\"; [ $((n - {{ IRQ_BEFORE }})) -gt 10 ]"
      - cmd: shell
        name: Captured data contains BIOS POST text
        transport: *bmc_ssh
        options:
          timeout: 5s
          on-failure: continue
        parameters:
          command: "strings /tmp/vuart_test.bin | grep -oiE 'Initialization|CHIF|Memory|BMC' | sort -u"
          expect:
            - regex: "(?i)initialization|chif|memory|bmc"
      - *restart_console

  # FirmwareCI has no run-condition "always"; on success the stage above restarted obmc-console.
  - name: Restart Console After Failure
    run-condition: failure
    steps:
      - *restart_console
