name: "Smoke: D-Bus Registrations"
description: >-
  Verify that every critical D-Bus well-known name of the board is registered
  on the system bus. The DUT attribute DBus.Names lists the names; the step
  names each one that busctl does not list.

defaults:
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: D-Bus Services Registered
    steps:
      # The SSH transport does not retry a refused connection, so wait for
      # the BMC on Redfish first.
      - cmd: redfish
        name: Redfish service answers
        transport:
          proto: local
        parameters:
          host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
          auth:
            user: "[[attributes.BMCUser]]"
            password: "[[attributes.BMCPassword]]"
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: shell
        name: Every critical D-Bus name is registered
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: >-
            l=$(busctl list --no-pager --no-legend | awk '{print $1}');
            m=$(for n in [[attributes.DBus.Names]]; do
            echo "$l" | grep -qF "$n" || echo "missing: $n"; done);
            echo "${m:-none}"
          expect:
            - regex: '^none$'
