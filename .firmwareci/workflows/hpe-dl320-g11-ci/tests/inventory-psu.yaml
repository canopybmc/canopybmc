name: "Inventory: Power Supplies"
description: >-
  Power on the host, then verify the power supplies over Redfish: the PSU
  sensors in the DUT attribute PSU.Sensors exist, the PSU power sensors of
  PSU.InputPower and PSU.OutputPower read above 0 W, the voltage sensors of
  PSU.InputVoltage and PSU.OutputVoltage read inside their ranges, the input
  power sensor is healthy, and the PowerSubsystem holds PSU.Count supplies
  that each report manufacturer, serial number and part number. Covers the
  gxp-psu kernel driver, the entity-manager PSU config and the
  PowerSubsystem Redfish path.

defaults:
  local: &local
    proto: local
  redfish: &redfish
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
    validate: inventory
  # A number above 0, as bmcweb prints it.
  above_zero: &above_zero '^([1-9][0-9]*(\.[0-9]+)?|0\.[0-9]*[1-9][0-9]*)$'

stages:
  - name: Power Supplies
    steps:
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *redfish
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: redfish
        name: The host is powered on
        transport: *local
        parameters:
          <<: *redfish
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: "On"}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "On"}
            retry: {timeout: 5m, interval: 5s}

      # bmcweb names each member <type>_<sensor name>.
      - cmd: redfish
        name: The board's PSU sensors exist
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            retry: {timeout: 3m, interval: 10s}
            rules:
              - {path: "[[attributes.RedfishChassis]]/Sensors", prop: Members, op: matches, value: '/Sensors/[a-z_]+_[[attributes.PSU.Sensors.0]]\b'}
              - {path: "[[attributes.RedfishChassis]]/Sensors", prop: Members, op: matches, value: '/Sensors/[a-z_]+_[[attributes.PSU.Sensors.1]]\b'}
              - {path: "[[attributes.RedfishChassis]]/Sensors", prop: Members, op: matches, value: '/Sensors/[a-z_]+_[[attributes.PSU.Sensors.2]]\b'}
              - {path: "[[attributes.RedfishChassis]]/Sensors", prop: Members, op: matches, value: '/Sensors/[a-z_]+_[[attributes.PSU.Sensors.3]]\b'}
              - {path: "[[attributes.RedfishChassis]]/Sensors", prop: Members, op: matches, value: '/Sensors/[a-z_]+_[[attributes.PSU.Sensors.4]]\b'}
              - {path: "[[attributes.RedfishChassis]]/Sensors", prop: Members, op: matches, value: '/Sensors/[a-z_]+_[[attributes.PSU.Sensors.5]]\b'}
              - {path: "[[attributes.RedfishChassis]]/Sensors", prop: Members, op: matches, value: '/Sensors/[a-z_]+_[[attributes.PSU.Sensors.6]]\b'}
              - {path: "[[attributes.RedfishChassis]]/Sensors", prop: Members, op: matches, value: '/Sensors/[a-z_]+_[[attributes.PSU.Sensors.7]]\b'}

      # The PSU readings settle after the host power-on.
      - cmd: redfish
        name: PSU input power reads above 0 W
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            retry: {timeout: 3m, interval: 10s}
            rules:
              - {path: "[[attributes.RedfishChassis]]/Sensors/[[attributes.PSU.InputPower]]", prop: Reading, op: matches, value: *above_zero}

      - cmd: redfish
        name: PSU output power reads above 0 W
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            retry: {timeout: 3m, interval: 10s}
            rules:
              - {path: "[[attributes.RedfishChassis]]/Sensors/[[attributes.PSU.OutputPower]]", prop: Reading, op: matches, value: *above_zero}

      - cmd: redfish
        name: PSU input voltage is in range
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            retry: {timeout: 3m, interval: 10s}
            rules:
              - {path: "[[attributes.RedfishChassis]]/Sensors/[[attributes.PSU.InputVoltage.Sensor]]", prop: Reading, op: range, value: "[[attributes.PSU.InputVoltage.Range]]"}

      - cmd: redfish
        name: PSU output voltage is in range
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            retry: {timeout: 3m, interval: 10s}
            rules:
              - {path: "[[attributes.RedfishChassis]]/Sensors/[[attributes.PSU.OutputVoltage.Sensor]]", prop: Reading, op: range, value: "[[attributes.PSU.OutputVoltage.Range]]"}

      - cmd: redfish
        name: PSU input power sensor is healthy
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishChassis]]/Sensors/[[attributes.PSU.InputPower]]", prop: Status/Health, op: eq, value: OK}

      - cmd: redfish
        name: The PowerSubsystem holds the board's power supplies
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishChassis]]/PowerSubsystem", collection: PowerSupplies, op: eq, value: "[[attributes.PSU.Count]]"}

      - cmd: redfish
        name: Every power supply reports its manufacturer
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishChassis]]/PowerSubsystem", forEach: PowerSupplies, prop: Manufacturer, op: matches, value: '\S'}

      - cmd: redfish
        name: Every power supply reports its serial number
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishChassis]]/PowerSubsystem", forEach: PowerSupplies, prop: SerialNumber, op: matches, value: '\S'}

      - cmd: redfish
        name: Every power supply reports its part number
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishChassis]]/PowerSubsystem", forEach: PowerSupplies, prop: PartNumber, op: matches, value: '\S'}
