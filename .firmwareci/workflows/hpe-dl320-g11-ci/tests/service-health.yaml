name: "Smoke: Service Health"
description: >-
  Verify that every critical OpenBMC service of the board is active. The DUT
  attribute Services.Active lists the systemd units; the step names each unit
  that is not active.

defaults:
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: Critical Services Running
    steps:
      # The SSH transport does not retry a refused connection, so wait for
      # the BMC on Redfish first.
      - cmd: redfish
        name: Redfish service answers
        transport:
          proto: local
        parameters:
          host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
          auth:
            user: "[[attributes.BMCUser]]"
            password: "[[attributes.BMCPassword]]"
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: shell
        name: Every critical service is active
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: >-
            r=$(for u in [[attributes.Services.Active]]; do
            s=$(systemctl is-active "$u"); [ "$s" = active ] || echo "$u: $s";
            done); echo "${r:-none}"
          expect:
            - regex: '^none$'
