name: "Inventory: Processors"
description: >-
  Verify the CPU inventory over Redfish after the host POST. Checks that
  SMBIOS processor data flows through smbios-mdr to Redfish: the Processors
  collection has members, and every present processor is Enabled and reports
  its manufacturer, at least 4 cores, its threads, its maximum speed, and
  its family and model. No serial number is the HPE placeholder "Proc N".
  The ProcessorSummary core count is above 0.

defaults:
  local: &local
    proto: local
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  redfish: &redfish
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
    validate: inventory
  present: &present {prop: Status/State, op: ne, value: Absent}

stages:
  - name: Processor Inventory
    steps:
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *redfish
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: redfish
        name: The host is powered on
        transport: *local
        parameters:
          <<: *redfish
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: "On"}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "On"}
            retry: {timeout: 5m, interval: 5s}

      # The host firmware sends SMBIOS late in POST. When the CHIF push queue
      # is full the transfer stalls, and a CHIF restart recovers it.
      - cmd: shell
        name: The host POST delivers SMBIOS data
        transport: *bmc
        options: {timeout: 15m}
        parameters:
          command: |
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full')
            while [ ! -f /var/lib/smbios/smbios2 ] ||
                  [ "$(stat -c %s /var/lib/smbios/smbios2 2>/dev/null || echo 0)" -le 1000 ]; do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full')
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF"
                systemctl restart xyz.openbmc_project.GxpChif.service
                full=$now
              fi
              sleep 5
            done
            echo "SMBIOS ready: $(stat -c %s /var/lib/smbios/smbios2) bytes"
          expect:
            - regex: '^SMBIOS ready'

      - cmd: redfish
        name: The Processors collection has members
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", collection: Processors, op: ge, value: "1"}

      - cmd: redfish
        name: Every present processor is Enabled
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", forEach: Processors, where: *present, prop: Status/State, op: eq, value: Enabled}

      - cmd: redfish
        name: Every present processor reports its manufacturer
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", forEach: Processors, where: *present, prop: Manufacturer, op: matches, value: '\S'}

      - cmd: redfish
        name: Every present processor has at least 4 cores
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", forEach: Processors, where: *present, prop: TotalCores, op: ge, value: "4"}

      - cmd: redfish
        name: Every present processor reports its threads
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", forEach: Processors, where: *present, prop: TotalThreads, op: ge, value: "1"}

      - cmd: redfish
        name: Every present processor reports its maximum speed
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", forEach: Processors, where: *present, prop: MaxSpeedMHz, op: ge, value: "1"}

      - cmd: redfish
        name: Every present processor reports its family
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", forEach: Processors, where: *present, prop: ProcessorId/EffectiveFamily, op: matches, value: '\S'}

      - cmd: redfish
        name: Every present processor reports its model
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", forEach: Processors, where: *present, prop: ProcessorId/EffectiveModel, op: matches, value: '\S'}

      # A processor without a serial number passes: only the placeholder is
      # wrong. RE2 has no negative lookahead: the regex matches every non-empty
      # value except the HPE placeholder "Proc <digit>".
      - cmd: redfish
        name: No processor serial number is HPE placeholder data
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - path: "[[attributes.RedfishSystem]]"
                forEach: Processors
                where: {prop: SerialNumber, op: exists}
                prop: SerialNumber
                op: matches
                value: '^([^P].*|P[^r].*|Pr[^o].*|Pro[^c].*|Proc[^ ].*|Proc [^0-9].*|Proc [0-9].+|P|Pr|Pro|Proc|Proc )$'

      - cmd: redfish
        name: ProcessorSummary CoreCount is above 0
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: ProcessorSummary/CoreCount, op: ge, value: "1"}
