name: "Inventory: Memory"
description: >-
  Verify the DIMM inventory over Redfish after the host POST. Checks that the
  CHIF to SMBIOS to Redfish pipeline reports the memory slots, at least one
  empty slot as Absent, the total system memory, and the two DIMMs in the DUT
  attribute Memory.Dimms: each one Enabled with its memory type,
  manufacturer, part number and serial number.

defaults:
  local: &local
    proto: local
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  redfish: &redfish
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
    validate: inventory

stages:
  - name: Memory Inventory
    steps:
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *redfish
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: redfish
        name: The host is powered on
        transport: *local
        parameters:
          <<: *redfish
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: "On"}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "On"}
            retry: {timeout: 5m, interval: 5s}

      # The host firmware sends SMBIOS late in POST. When the CHIF push queue
      # is full the transfer stalls, and a CHIF restart recovers it.
      - cmd: shell
        name: The host POST delivers SMBIOS data
        transport: *bmc
        options: {timeout: 15m}
        parameters:
          command: |
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full')
            while [ ! -f /var/lib/smbios/smbios2 ] ||
                  [ "$(stat -c %s /var/lib/smbios/smbios2 2>/dev/null || echo 0)" -le 1000 ]; do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full')
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF"
                systemctl restart xyz.openbmc_project.GxpChif.service
                full=$now
              fi
              sleep 5
            done
            echo "SMBIOS ready: $(stat -c %s /var/lib/smbios/smbios2) bytes"
          expect:
            - regex: '^SMBIOS ready'

      - cmd: redfish
        name: The Memory collection has members
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", collection: Memory, op: ge, value: "1"}

      # sum fails when no member matches, so this also proves that at least
      # one empty slot is listed.
      - cmd: redfish
        name: Empty slots are reported Absent with no capacity
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - path: "[[attributes.RedfishSystem]]"
                forEach: Memory
                where: {prop: Status/State, op: eq, value: Absent}
                prop: CapacityMiB
                op: sum
                value: "0"

      - cmd: redfish
        name: "[[attributes.Memory.Dimms.0.Id]] is Enabled"
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]/Memory/[[attributes.Memory.Dimms.0.Id]]", prop: Status/State, op: eq, value: Enabled}

      - cmd: redfish
        name: "[[attributes.Memory.Dimms.0.Id]] is the board's module"
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]/Memory/[[attributes.Memory.Dimms.0.Id]]", prop: MemoryDeviceType, op: eq, value: "[[attributes.Memory.Dimms.0.Type]]"}
              - {path: "[[attributes.RedfishSystem]]/Memory/[[attributes.Memory.Dimms.0.Id]]", prop: Manufacturer, op: eq, value: "[[attributes.Memory.Dimms.0.Manufacturer]]"}
              - {path: "[[attributes.RedfishSystem]]/Memory/[[attributes.Memory.Dimms.0.Id]]", prop: PartNumber, op: eq, value: "[[attributes.Memory.Dimms.0.PartNumber]]"}
              - {path: "[[attributes.RedfishSystem]]/Memory/[[attributes.Memory.Dimms.0.Id]]", prop: SerialNumber, op: eq, value: "[[attributes.Memory.Dimms.0.Serial]]"}

      - cmd: redfish
        name: "[[attributes.Memory.Dimms.1.Id]] is Enabled"
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]/Memory/[[attributes.Memory.Dimms.1.Id]]", prop: Status/State, op: eq, value: Enabled}

      - cmd: redfish
        name: "[[attributes.Memory.Dimms.1.Id]] is the board's module"
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]/Memory/[[attributes.Memory.Dimms.1.Id]]", prop: MemoryDeviceType, op: eq, value: "[[attributes.Memory.Dimms.1.Type]]"}
              - {path: "[[attributes.RedfishSystem]]/Memory/[[attributes.Memory.Dimms.1.Id]]", prop: Manufacturer, op: eq, value: "[[attributes.Memory.Dimms.1.Manufacturer]]"}
              - {path: "[[attributes.RedfishSystem]]/Memory/[[attributes.Memory.Dimms.1.Id]]", prop: PartNumber, op: eq, value: "[[attributes.Memory.Dimms.1.PartNumber]]"}
              - {path: "[[attributes.RedfishSystem]]/Memory/[[attributes.Memory.Dimms.1.Id]]", prop: SerialNumber, op: eq, value: "[[attributes.Memory.Dimms.1.Serial]]"}

      - cmd: redfish
        name: TotalSystemMemoryGiB is above 0
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: MemorySummary/TotalSystemMemoryGiB, op: matches, value: '^([1-9][0-9]*(\.[0-9]+)?|0\.[0-9]*[1-9][0-9]*)$'}
