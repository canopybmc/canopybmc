name: "Host Firmware: Update"
description: >-
  Update the host firmware (aka BIOS) via Redfish and verify it is booting the
  new one: the host first runs the golden image's BIOS version, the BIOS
  firmware inventory item is updateable, the BMC accepts the PLDM package,
  its update task completes, the journal reports UpdateSuccessful, the
  firmware inventory item changes, and the host comes back with the version
  of the package.

  For HPE some magic firmware preparation is needed beforehand to get a correct
  PLDM package.

  If flashing takes too long, bmcweb cancels the Redfish task while the flash
  goes on. A Cancelled task fails its step, but the test goes on to the
  journal step, which shows the flash result ("UpdateSuccessful", or
  "ActivateFailed" or "UpdateNotApplicable" for an error).

defaults:
  local: &local
    proto: local
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  redfish: &redfish
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

variables:
  UpdateEndpointPrefix: UEFIPrimary
  BiosVersionBefore: null
  BiosVersionUpdate: null
  UpdateTarget: null
  UpdateTask: null

stages:
  - name: Host Firmware Update
    steps:
      # Like strings(1): a printable run that is exactly "U63 v<version>".
      - cmd: shell
        name: Extract BiosVersionBefore from golden image
        transport: *local
        parameters:
          command: >-
            LC_ALL=C grep -a -o -P '(?<![\t[:print:]])U63 v\K[0-9]\.[0-9]+(?![\t[:print:]])'
            '[[storage.dl320g11_bios_update]]/[[storage.dl320g11_bios_update.golden_image]]'
            | tail -n 1
          expect:
            - regex: '^[0-9]\.[0-9]+$'
          variable: BiosVersionBefore

      - cmd: shell
        name: Extract BiosVersionUpdate from PLDM package
        transport: *local
        parameters:
          command: >-
            LC_ALL=C grep -a -o -P '(?<![\t[:print:]])U63 v\K[0-9]\.[0-9]+(?![\t[:print:]])'
            '[[storage.dl320g11_bios_update]]/[[storage.dl320g11_bios_update.pldm]]'
            | tail -n 1
          expect:
            - regex: '^[0-9]\.[0-9]+$'
          variable: BiosVersionUpdate

      - cmd: redfish
        name: The host is powered on
        transport: *local
        parameters:
          <<: *redfish
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: "On"}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "On"}
            retry: {timeout: 5m, interval: 5s}

      # The host firmware sends SMBIOS late in POST. When the CHIF push queue
      # is full the transfer stalls, and a CHIF restart recovers it.
      - cmd: shell
        name: The host POST delivers SMBIOS data
        transport: *bmc
        options: {timeout: 12m}
        parameters:
          command: |
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full')
            while [ ! -f /var/lib/smbios/smbios2 ] ||
                  [ "$(stat -c %s /var/lib/smbios/smbios2 2>/dev/null || echo 0)" -le 1000 ]; do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full')
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF"
                systemctl restart xyz.openbmc_project.GxpChif.service
                full=$now
              fi
              sleep 5
            done
            echo "SMBIOS ready: $(stat -c %s /var/lib/smbios/smbios2) bytes"
          expect:
            - regex: '^SMBIOS ready'

      - cmd: ping
        name: Wait for host OS
        options:
          timeout: 5m
        parameters:
          host: "[[attributes.Host]]"

      - cmd: redfish
        name: The host runs the golden BIOS version
        transport: *local
        parameters:
          <<: *redfish
          validate: inventory
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: BiosVersion, op: matches, value: "{{ BiosVersionBefore }}"}

      # The inventory id has a counter that changes with each update, and no
      # native rule can store a member id found by a pattern.
      - cmd: shell
        name: Get update endpoint
        transport: *local
        options: {timeout: 30s}
        parameters:
          command: >-
            curl -sk -u '[[attributes.BMCUser]]:[[attributes.BMCPassword]]'
            'https://[[attributes.BMC]]:[[attributes.RedfishPort]]/redfish/v1/UpdateService/FirmwareInventory'
            | grep -Eo '{{ UpdateEndpointPrefix }}_[0-9]+' | head -n 1
          expect:
            - regex: '^{{ UpdateEndpointPrefix }}_\d+$'
          variable: UpdateTarget

      - cmd: redfish
        name: The BIOS firmware is updateable
        transport: *local
        parameters:
          <<: *redfish
          validate: inventory
          inventory:
            rules:
              - {path: "/redfish/v1/UpdateService/FirmwareInventory/{{ UpdateTarget }}", prop: Updateable, op: eq, value: "true"}

      - cmd: redfish
        name: The BMC accepts the PLDM package
        transport: *local
        parameters:
          <<: *redfish
          validate: request
          request:
            method: POST
            path: /redfish/v1/UpdateService/update-multipart
            upload: multipart
            file: "[[storage.dl320g11_bios_update]]/[[storage.dl320g11_bios_update.pldm]]"
            body:
              Targets: ["/redfish/v1/UpdateService/FirmwareInventory/{{ UpdateTarget }}"]
              "@Redfish.OperationApplyTime": Immediate
            status: 202
            timeout: 5m
            rules:
              - {prop: "@odata.id", op: matches, value: '^/redfish/v1/TaskService/Tasks/[0-9]+$', variable: UpdateTask}

      - cmd: redfish
        name: The update task completes
        transport: *local
        options: {on-failure: continue}
        parameters:
          <<: *redfish
          validate: inventory
          inventory:
            retry: {timeout: 10m, interval: 5s}
            rules:
              - {path: "{{ UpdateTask }}", prop: TaskState, op: eq, value: Completed}

      - cmd: shell
        name: Wait for update finish (systemd-journal)
        transport: *bmc
        options: {timeout: 5m}
        parameters:
          command: |
            journalctl -n 5 -t phosphor-spi-flash-software-update -t power-control -f \
              | awk '{print} /UpdateSuccessful|ActivateFailed|UpdateNotApplicable/{exit}'
          expect:
            - regex: 'UpdateSuccessful'

      - cmd: shell
        name: The firmware inventory lists a new BIOS item
        transport: *local
        options:
          timeout: 30s
          on-failure: continue
        parameters:
          command: >-
            t=$(curl -sk -u '[[attributes.BMCUser]]:[[attributes.BMCPassword]]'
            'https://[[attributes.BMC]]:[[attributes.RedfishPort]]/redfish/v1/UpdateService/FirmwareInventory'
            | grep -Eo '{{ UpdateEndpointPrefix }}_[0-9]+' | head -n 1);
            if [ -n "$t" ] && [ "$t" != "{{ UpdateTarget }}" ]; then echo "$t";
            else echo "unchanged: ${t:-none}"; fi
          expect:
            - regex: '^{{ UpdateEndpointPrefix }}_\d+$'

      - cmd: ping
        name: Wait for host OS after the update
        options:
          timeout: 10m
          on-failure: continue
        parameters:
          host: "[[attributes.Host]]"

      - cmd: redfish
        name: The host runs the BIOS version of the package
        transport: *local
        parameters:
          <<: *redfish
          validate: inventory
          inventory:
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: BiosVersion, op: eq, value: "{{ BiosVersionUpdate }}"}
