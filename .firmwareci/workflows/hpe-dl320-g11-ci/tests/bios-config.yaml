name: "BIOS: Boot Option Config Bridge"
description: >-
  Verify that BiosConfigService parses the CQSBOOT#### boot option
  records published by the host firmware and exposes them as read-only
  BIOSConfig attributes. Resets the BIOS NVRAM over Redfish and boots the
  host once, so that the firmware publishes its boot options over CHIF. Then
  checks the persisted EV store on the BMC, the service journal, and the
  BaseBIOSTable published on D-Bus by biosconfig-manager.

  Note! these attributes are currently not visible via the Redfish
  /Systems/system/Bios route.

defaults:
  local: &local
    proto: local
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  redfish: &redfish
    host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
    auth:
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"

stages:
  - name: Boot Option Config Bridge
    steps:
      # The SSH transport does not retry a refused connection, so wait for
      # the BMC on Redfish first.
      - cmd: redfish
        name: Redfish service answers
        transport: *local
        parameters:
          <<: *redfish
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: redfish
        name: The host is powered off
        transport: *local
        parameters:
          <<: *redfish
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: ForceOff}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "Off"}
            retry: {timeout: 2m, interval: 5s}

      - cmd: redfish
        name: Redfish ResetBios is accepted
        transport: *local
        parameters:
          <<: *redfish
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Bios/Actions/Bios.ResetBios"
            status: [200, 204]

      # The NVRAM reset finishes after Bios.ResetBios answers, and the test
      # knows no state that shows when it is done.
      - cmd: sleep
        name: Wait for the NVRAM reset to finish
        parameters:
          duration: 20s

      - cmd: redfish
        name: The host is powered on
        transport: *local
        parameters:
          <<: *redfish
          validate: request
          request:
            method: POST
            path: "[[attributes.RedfishSystem]]/Actions/ComputerSystem.Reset"
            body: {ResetType: "On"}
            status: [200, 204]
            rules:
              - {path: "[[attributes.RedfishSystem]]", prop: PowerState, op: eq, value: "On"}
            retry: {timeout: 5m, interval: 5s}

      # The host firmware sends SMBIOS late in POST. When the CHIF push queue
      # is full the transfer stalls, and a CHIF restart recovers it. The first
      # POST after an NVRAM reset takes much longer.
      - cmd: shell
        name: The host POST delivers SMBIOS data
        transport: *bmc
        options: {timeout: 20m}
        parameters:
          command: |
            full=$(journalctl -k --no-pager | grep -c 'push: queue is full')
            while [ ! -f /var/lib/smbios/smbios2 ] ||
                  [ "$(stat -c %s /var/lib/smbios/smbios2 2>/dev/null || echo 0)" -le 1000 ]; do
              now=$(journalctl -k --no-pager | grep -c 'push: queue is full')
              if [ "$now" -gt "$full" ]; then
                echo "CHIF push queue full ($full -> $now): restarting CHIF"
                systemctl restart xyz.openbmc_project.GxpChif.service
                full=$now
              fi
              sleep 5
            done
            echo "SMBIOS ready: $(stat -c %s /var/lib/smbios/smbios2) bytes"
          expect:
            - regex: '^SMBIOS ready'

      - cmd: ping
        name: Wait for host OS
        options:
          timeout: 5m
        parameters:
          host: "[[attributes.Host]]"

      - cmd: shell
        name: CHIF service is active
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: systemctl is-active xyz.openbmc_project.GxpChif.service
          expect:
            - regex: '^active$'

      - cmd: shell
        name: Boot option EVs (CQSBOOT) persisted by firmware
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: grep -a -o CQSBOOT /var/lib/chif/evs.dat | wc -l
          expect:
            - regex: '^[1-9][0-9]*$'

      - cmd: shell
        name: BiosConfigService published boot options (journal)
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: >-
            journalctl -u xyz.openbmc_project.GxpChif.service --no-pager
            | grep 'BIOS config: published'
          expect:
            - regex: 'published [1-9][0-9]* boot option'

      - cmd: shell
        name: BIOSConfigManager registered on D-Bus
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: busctl list --no-pager --no-legend | awk '$1 == "xyz.openbmc_project.BIOSConfigManager" {print $1}'
          expect:
            - regex: '^xyz\.openbmc_project\.BIOSConfigManager$'

      - cmd: shell
        name: BaseBIOSTable contains Boot## attributes (D-Bus)
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.BIOSConfigManager
            /xyz/openbmc_project/bios_config/manager
            xyz.openbmc_project.BIOSConfig.Manager BaseBIOSTable --no-pager
          expect:
            - regex: 'Boot[0-9A-Fa-f]{2}'
