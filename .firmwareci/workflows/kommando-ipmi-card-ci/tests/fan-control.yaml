name: "Sensor: Fan Control"
description: >-
  Verify PID fan control is running and producing reasonable PWM values.
  Covers phosphor-pid-control, fan sensor config, PID zones from
  entity-manager, and fan presence monitoring. Each PWM sensor in the DUT
  attribute Fans.Pwms must read 5 to 100 percent.

defaults:
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  # busctl prints "d <value>"; the regex accepts 5 to 100.
  pwm_in_range: &pwm_in_range
    - regex: '^d (([5-9]|[1-9][0-9])(\.[0-9]+)?|100(\.0+)?)$'

stages:
  - name: Fan Control
    steps:
      # The SSH transport does not retry a refused connection, so wait for
      # the BMC on Redfish first.
      - cmd: redfish
        name: Redfish service answers
        transport:
          proto: local
        parameters:
          host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
          auth:
            user: "[[attributes.BMCUser]]"
            password: "[[attributes.BMCPassword]]"
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      # The fan sensor service publishes the PWM objects some time after
      # Redfish answers.
      - cmd: shell
        name: The PWM sensors are on D-Bus
        transport: *bmc
        options: {timeout: 3m}
        parameters:
          command: >-
            p=/xyz/openbmc_project/sensors/fan_pwm;
            for i in $(seq 24); do
            busctl introspect xyz.openbmc_project.FanSensor $p/[[attributes.Fans.Pwms.0]] >/dev/null 2>&1 &&
            busctl introspect xyz.openbmc_project.FanSensor $p/[[attributes.Fans.Pwms.1]] >/dev/null 2>&1 &&
            break; sleep 5; done;
            busctl introspect xyz.openbmc_project.FanSensor $p/[[attributes.Fans.Pwms.0]] >/dev/null 2>&1 &&
            busctl introspect xyz.openbmc_project.FanSensor $p/[[attributes.Fans.Pwms.1]] >/dev/null 2>&1 &&
            echo published || echo missing
          expect:
            - regex: '^published$'

      - cmd: shell
        name: phosphor-pid-control is active
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: systemctl is-active phosphor-pid-control.service
          expect:
            - regex: '^active$'

      - cmd: shell
        name: Fan presence service is active
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: systemctl is-active phosphor-fan-presence-tach@0.service
          expect:
            - regex: '^active$'

      # One step per item of Fans.Pwms: a list attribute cannot go into a
      # command string.
      - cmd: shell
        name: "[[attributes.Fans.Pwms.0]] is in 5-100% range"
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.FanSensor
            /xyz/openbmc_project/sensors/fan_pwm/[[attributes.Fans.Pwms.0]]
            xyz.openbmc_project.Sensor.Value Value
          expect: *pwm_in_range

      - cmd: shell
        name: "[[attributes.Fans.Pwms.1]] is in 5-100% range"
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: >-
            busctl get-property xyz.openbmc_project.FanSensor
            /xyz/openbmc_project/sensors/fan_pwm/[[attributes.Fans.Pwms.1]]
            xyz.openbmc_project.Sensor.Value Value
          expect: *pwm_in_range

      - cmd: shell
        name: PID zone exists on D-Bus
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: busctl tree xyz.openbmc_project.State.FanCtrl --no-pager
          expect:
            - regex: 'zone'
