name: "KVM: Userspace Services"
description: >-
  Verify the OpenBMC KVM-over-IP userspace stack: obmc-ikvm runs without
  restarts on the video device and the HID gadgets, the HID gadget setup
  script is installed, the USB gadget has the Linux Foundation vendor ID and
  the product string of the DUT attribute KVM.Product, VNC listens on port
  5900, and bmcweb upgrades /kvm/0 to a WebSocket.

defaults:
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  ikvm_cmdline: &ikvm_cmdline 'tr "\0" " " < /proc/$(pidof obmc-ikvm)/cmdline'

stages:
  - name: KVM Userspace
    steps:
      # The SSH transport does not retry a refused connection, so wait for
      # the BMC on Redfish first.
      - cmd: redfish
        name: Redfish service answers
        transport:
          proto: local
        parameters:
          host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
          auth:
            user: "[[attributes.BMCUser]]"
            password: "[[attributes.BMCPassword]]"
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: shell
        name: obmc-ikvm service is active
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: systemctl is-active obmc-ikvm.service
          expect:
            - regex: '^active$'

      - cmd: shell
        name: obmc-ikvm did not restart
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: systemctl show -p NRestarts --value obmc-ikvm.service
          expect:
            - regex: '^0$'

      - cmd: shell
        name: obmc-ikvm captures from /dev/video0
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: *ikvm_cmdline
          expect:
            - regex: '/dev/video0'

      - cmd: shell
        name: obmc-ikvm drives the keyboard gadget /dev/hidg0
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: *ikvm_cmdline
          expect:
            - regex: '/dev/hidg0'

      - cmd: shell
        name: obmc-ikvm drives the mouse gadget /dev/hidg1
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: *ikvm_cmdline
          expect:
            - regex: '/dev/hidg1'

      - cmd: shell
        name: create_usbhid.sh is installed and executable
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: ls -l /usr/bin/create_usbhid.sh
          expect:
            - regex: '^-..x'

      - cmd: shell
        name: Gadget vendor is Linux Foundation (0x1d6b)
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: cat /sys/kernel/config/usb_gadget/obmc_hid/idVendor
          expect:
            - regex: '^0x1d6b$'

      - cmd: shell
        name: Gadget product string is the board's
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: cat /sys/kernel/config/usb_gadget/obmc_hid/strings/0x409/product
          expect:
            - regex: '^[[attributes.KVM.Product]]$'

      # State 0A is LISTEN; 170C is port 5900.
      - cmd: shell
        name: VNC port 5900 is listening
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: cat /proc/net/tcp /proc/net/tcp6
          expect:
            - regex: '^\s*\d+: [0-9A-F]+:170C [0-9A-F]+:0000 0A '

      # The vnc step needs a video frame, and the host is off in this test.
      # curl runs into --max-time after the 101 answer, so only its status
      # code counts.
      - cmd: shell
        name: bmcweb upgrades /kvm/0 to a WebSocket
        transport:
          proto: local
        options:
          timeout: 15s
          on-failure: continue
        parameters:
          command: >-
            code=$(curl -sk --http1.1 --max-time 5
            -u '[[attributes.BMCUser]]:[[attributes.BMCPassword]]'
            -o /dev/null -w '%{http_code}'
            -H 'Upgrade: websocket' -H 'Connection: Upgrade'
            -H 'Sec-WebSocket-Key: dGVzdA==' -H 'Sec-WebSocket-Version: 13'
            'https://[[attributes.BMC]]:[[attributes.RedfishPort]]/kvm/0');
            echo "$code"
          expect:
            - regex: '^101$'
