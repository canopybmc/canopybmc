name: "Console: VUART Userspace"
description: >-
  Verify the OpenBMC host console stack: obmc-console-server on ttyVUART0
  with the host tty of the DUT attribute Console.HostTty open, its
  configuration, the udev symlink and rule, the console socket, the
  obmc-console-ssh port, log file capture and the console client. This is an
  OpenBMC userspace test: it validates the phosphor console infrastructure on
  top of the board's UART driver.

defaults:
  bmc: &bmc
    proto: ssh
    options:
      host: "[[attributes.BMC]]"
      port: "[[attributes.SSHPort]]"
      user: "[[attributes.BMCUser]]"
      password: "[[attributes.BMCPassword]]"
  server_pid: &server_pid 'ls -l /proc/$(systemctl show -p MainPID --value obmc-console@ttyVUART0.service)/fd/'

stages:
  - name: Host Console
    steps:
      # The SSH transport does not retry a refused connection, so wait for
      # the BMC on Redfish first.
      - cmd: redfish
        name: Redfish service answers
        transport:
          proto: local
        parameters:
          host: "[[attributes.BMC]]:[[attributes.RedfishPort]]"
          auth:
            user: "[[attributes.BMCUser]]"
            password: "[[attributes.BMCPassword]]"
          validate: inventory
          inventory:
            retry: {timeout: 10m}
            rules:
              - {path: /redfish/v1, collection: Managers, op: ge, value: "1"}

      - cmd: shell
        name: obmc-console-server active on ttyVUART0
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: systemctl is-active obmc-console@ttyVUART0.service
          expect:
            - regex: '^active$'

      - cmd: shell
        name: Server process runs for ttyVUART0
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: 'tr "\0" " " < /proc/$(systemctl show -p MainPID --value obmc-console@ttyVUART0.service)/cmdline'
          expect:
            - regex: 'ttyVUART0'

      - cmd: shell
        name: Server has the host tty open
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: *server_pid
          expect:
            - regex: '-> /dev/[[attributes.Console.HostTty]]$'

      - cmd: shell
        name: Server config sets logsize
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: cat /etc/obmc-console/server.ttyVUART0.conf
          expect:
            - regex: '^\s*logsize'

      - cmd: shell
        name: No self-referencing local-tty in config
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: awk '/local-tty/ {n++} END {print n+0}' /etc/obmc-console/server.ttyVUART0.conf
          expect:
            - regex: '^0$'

      - cmd: shell
        name: ttyVUART0 symlink points to the host tty
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: ls -l /dev/ttyVUART0
          expect:
            - regex: '^l.*-> (.*/)?[[attributes.Console.HostTty]]$'

      - cmd: shell
        name: Console udev rule installed
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: ls -l /usr/lib/udev/rules.d/[[attributes.Console.UdevRule]]
          expect:
            - regex: '^-'

      - cmd: shell
        name: Abstract socket obmc-console.default exists
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: cat /proc/net/unix
          expect:
            - regex: '@obmc-console\.default'

      - cmd: shell
        name: obmc-console-ssh socket active
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: systemctl is-active obmc-console-ssh.socket
          expect:
            - regex: '^active$'

      - cmd: shell
        name: Dropbear config exists
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: ls -l /etc/obmc-console/dropbear.env
          expect:
            - regex: '^-'

      - cmd: ping
        name: Console SSH port accepts connections
        options:
          timeout: 10s
          on-failure: continue
        parameters:
          host: "[[attributes.BMC]]"
          port: "[[attributes.Console.SshPort]]"

      - cmd: shell
        name: Log file exists at /var/log/obmc-console.log
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: ls -l /var/log/obmc-console.log
          expect:
            - regex: '^-'

      - cmd: shell
        name: Log file open by console server
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: *server_pid
          expect:
            - regex: '-> /var/log/obmc-console\.log$'

      - cmd: shell
        name: obmc-console-client is installed and executable
        transport: *bmc
        options: {on-failure: continue}
        parameters:
          command: ls -l /usr/bin/obmc-console-client
          expect:
            - regex: '^-..x'
