---
name: Build, test and release

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths-ignore:
      - "doc/**"
      - "README.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "doc/**"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  get-matrix:
    runs-on: ubuntu-latest
    name: Get list of build targets
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Matrix / Board
      - name: get-board
        id: get-board
        run: |
          board=$(jq -cn '[
            "canopy-qemu",
            "hpe-proliant-g11"
          ]')
          echo "board=$board" >> "$GITHUB_OUTPUT"
      - name: Check JSON validity
        run: |
          jq . <<< '${{ steps.get-board.outputs.board }}'

      # Matrix / Workflow
      - name: get-workflow
        id: get-workflow
        run: |
          if [[ "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref_type == 'tag' }}" == "true" ]]; then
            workflow=$(jq -cn '[
              "main",
              "ci",
              "ipmi"
            ]')
          else
            workflow=$(jq -cn '[
              "ci"
            ]')
          fi
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
      - name: Check JSON validity
        run: |
          jq . <<< '${{ steps.get-workflow.outputs.workflow }}'

      # Matrix / Include
      - name: get-include
        id: get-include
        run: |
          include=$(jq -cn '[
            {
              "board": "hpe-proliant-g11",
              "fwci_workflow_name_prefix": "hpe-dl320-g11",
              "fwci_binary_name": "obmc-phosphor-image-hpe-proliant-g11.GXP2loader-t282-t288-sgn00.static.mtd"
            }
          ]')
          echo "include=$include" >> "$GITHUB_OUTPUT"
      - name: Check JSON validity
        run: |
          jq . <<< '${{ steps.get-include.outputs.include }}'
    outputs:
      board: ${{ steps.get-board.outputs.board }}
      workflow: ${{ steps.get-workflow.outputs.workflow }}
      include: ${{ steps.get-include.outputs.include }}

  build-target:
    runs-on: [self-hosted, Hydra, Large]
    needs:
      - get-matrix
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.get-matrix.outputs.board) }}
        include: ${{ fromJson(needs.get-matrix.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        uses: ./.github/actions/build
        with:
          board: ${{ matrix.board }}
          signing-key: ${{ secrets.HPE_9E_SIGNING_KEY }}
        # This build action uploads the files as "obmc-phosphor-image-${{ inputs.board }}"

  firmwareci:
    runs-on: ubuntu-latest
    needs:
      - get-matrix
      - build-target
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.get-matrix.outputs.board) }}
        workflow: ${{ fromJson(needs.get-matrix.outputs.workflow) }}
        include: ${{ fromJson(needs.get-matrix.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Define workflow name
        id: workflow-name
        run: |
          echo "workflow_name=${{ matrix.fwci_workflow_name_prefix && format('{0}-{1}', matrix.fwci_workflow_name_prefix, matrix.workflow) || format('{0}-{1}', matrix.board, matrix.workflow) }}" >> "$GITHUB_OUTPUT"
        # Use `matrix.fwci_workflow_name_prefix` if defined, else fallback to `matrix.board`

      - name: Check if FirmwareCI workflow exists
        id: check-workflow
        run: |
          if [ -d ".firmwareci/workflows/${{ steps.workflow-name.outputs.workflow_name }}" ]; then
            echo "workflow_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflow_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug
        run: |
          echo "WORKFLOW_NAME = ${{ steps.workflow-name.outputs.workflow_name }}"
          echo "WORKFLOW_EXISTS = ${{ steps.check-workflow.outputs.workflow_exists }}"

      - name: Download firmware image
        if: steps.check-workflow.outputs.workflow_exists == 'true'
        uses: actions/download-artifact@v8
        with:
          name: obmc-phosphor-image-${{ matrix.board }}

      - name: Upload to FirmwareCI
        if: steps.check-workflow.outputs.workflow_exists == 'true'
        uses: docker://firmwareci/action:v6.0
        with:
          TOKEN: ${{ secrets.FWCI_TOKEN }}
          WORKFLOW_NAME: ${{ steps.workflow-name.outputs.workflow_name }}
          BINARIES: firmware=${{ matrix.fwci_binary_name || format('obmc-phosphor-image-{0}.static.mtd', matrix.board) }}
          GITHUB_INSTALLATION_ID: ${{ secrets.FWCI_GITHUB_INSTALLATION_ID }}

  release:
    # For detailed description see "doc/releases.md"
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - build-target # needed for artifacts
      - firmwareci # we want to only release on functional and tested codebase
    permissions:
      contents: write # To create a new release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get the version of the new release
        # The 'current' version in the JSON file is actually the next version at this point in time,
        #   as it was just updated in the 'release-prepare.yml' job
        id: get_version
        run: |
          CURRENT_VERSION=$( jq '.current' < release-notes/versions.json | sed 's/"//g' )
          echo "current_version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check that release notes file for this release exists
        run: |
          if [ ! -f "release-notes/${{ steps.get_version.outputs.current_version }}.md" ]; then
            echo "Error: Release notes file 'release-notes/${{ steps.get_version.outputs.current_version }}.md' does not exist"
            exit 1
          fi
          echo "Release notes file found: release-notes/${{ steps.get_version.outputs.current_version }}.md"

      - name: Checkout
        # Checkout into sub-directory, this one is used to create a clean source archive
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # TODO: Do we want all git submodules to also be part of the source release (the .tar file)?
          path: "canopybmc-${{ steps.get_version.outputs.current_version }}"
          fetch-depth: 0
          fetch-tags: true

      - name: Create source archives
        run: |
          zip -r "canopybmc-${{ steps.get_version.outputs.current_version }}.zip" "canopybmc-${{ steps.get_version.outputs.current_version }}"
          tar -czvf "canopybmc-${{ steps.get_version.outputs.current_version }}.tar.gz" "canopybmc-${{ steps.get_version.outputs.current_version }}"

      - name: Download all firmware images
        uses: actions/download-artifact@v8
        with:
          path: binaries/
          pattern: obmc-phosphor-image-*
          skip-decompress: true
          # We want ZIP files for each target to be released

      - name: Release with GH Release action
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes/${{ steps.get_version.outputs.current_version }}.md
          files: |
            canopybmc-${{ steps.get_version.outputs.current_version }}.zip
            canopybmc-${{ steps.get_version.outputs.current_version }}.tar.gz
            binaries/**/*
